[project]
name = "nemml"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Onah Stephen", email = "stephenobumonah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
nemml = "nemml.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/nemml/fraud.py" = ["E501"]  # model card prose
"src/nemml/categories.py" = ["E501"]  # model card prose
"src/nemml/credit.py" = ["E501"]  # model card prose
"src/nemml/categories_data.py" = ["E501"]  # word lists
"src/nemml/merchants.py" = ["E501"]  # merchant lists
"src/nemml/scam.py" = ["E501"]  # model card prose
"src/nemml/scam_data.py" = ["E501"]  # message templates
"src/nemml/scam_rules.py" = ["E501"]  # regular expressions

[tool.pytest.ini_options]
testpaths = ["tests"]
