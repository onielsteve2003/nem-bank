name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint (ESLint + Redocly)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated API types are up to date
        run: pnpm --filter @nem/contracts check:generated

      - name: Test
        run: pnpm test

  console:
    name: Console build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same command Vercel runs (apps/console/vercel.json): typecheck + Vite build.
      - name: Build
        run: pnpm --filter console build

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # oapi-codegen is pinned as a go.mod tool, so this is the same generator as local.
      - name: Generated server is up to date with the contract
        run: |
          go generate ./internal/api
          git diff --exit-code -- internal/api

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/api

      # Docker is available on the runner, so testdb starts Postgres with testcontainers.
      # CI=true makes a missing Docker a failure instead of a skip.
      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
