components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed access token (10-minute lifetime).
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Console staff token, issued only after TOTP (8-hour lifetime). Audience `console`; customer tokens are rejected.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: Developer API key (`nem_test_…`) sent as a bearer token. Scoped and revocable (DEV-1).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv7 chosen by the client. Replays return the stored response; the same key with a different body returns 422.
      schema:
        $ref: '#/components/schemas/Uuid'
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: The bound device that signed the request.
      schema:
        $ref: '#/components/schemas/Uuid'
    DeviceSignature:
      name: X-Device-Signature
      in: header
      required: true
      description: Base64url Ed25519 signature over the canonical request payload.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
    SignatureTimestamp:
      name: X-Signature-Timestamp
      in: header
      required: true
      description: When the payload was signed. Must be within ±5 minutes of server time.
      schema:
        type: string
        format: date-time
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: Single-use random value that prevents replay.
      schema:
        type: string
        minLength: 16
        maxLength: 64
    StepUpTokenHeader:
      name: X-Step-Up-Token
      in: header
      required: true
      description: Short-lived token from `POST /v1/auth/step-up/{step_up_id}/verify`, bound to one purpose.
      schema:
        type: string
    OptionalStepUpTokenHeader:
      name: X-Step-Up-Token
      in: header
      required: false
      description: Send when the quote said step-up is needed, to skip the cooling-off delay.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromDate:
      name: from
      in: query
      required: false
      description: Inclusive start date.
      schema:
        $ref: '#/components/schemas/Date'
    ToDate:
      name: to
      in: query
      required: false
      description: Inclusive end date.
      schema:
        $ref: '#/components/schemas/Date'
    StepUpId:
      name: step_up_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DeviceIdPath:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    StatementId:
      name: statement_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TransferId:
      name: transfer_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BeneficiaryId:
      name: beneficiary_id
      in: path
