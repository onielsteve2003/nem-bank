        $ref: '#/components/schemas/Uuid'
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DisputeId:
      name: dispute_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DependantId:
      name: dependant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ActionId:
      name: action_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LedgerAccountId:
      name: ledger_account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FlagKey:
      name: flag_key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{2,50}$'
    AuthorizationId:
      name: authorization_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    WebhookSignature:
      name: Nem-Signature
      in: header
      required: true
      description: |
        `t=<unix seconds>,v1=<hex HMAC-SHA256>`, signed over `<t>.<raw body>` with the endpoint's
        signing secret. Reject if `t` is more than 5 minutes old. During secret rotation a second
        `v1=` value is included.
      schema:
        type: string
    WebhookEventId:
      name: Nem-Event-Id
      in: header
      required: true
      description: Same value on every retry and replay, for deduplication.
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    # ------------------------------------------------------------ primitives
    Uuid:
      type: string
      format: uuid
      examples: ['0192f5a4-7c1e-7b3a-9f10-3c5d2e8a4b61']
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Date:
      type: string
      format: date
      description: Calendar date in Africa/Lagos.
    CurrencyCode:
      type: string
      description: ISO 4217 code of a supported currency.
      enum: [NGN, USD, GBP, EUR]
    MinorUnits:
      type: string
      description: Non-negative integer amount in minor units, as a string.
      pattern: '^(0|[1-9][0-9]*)$'
      examples: ['500000']
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: string
          description: Signed integer amount in minor units (kobo, cents, pence), as a string.
          pattern: '^-?(0|[1-9][0-9]*)$'
          examples: ['150000']
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    PhoneNumber:
      type: string
      description: Nigerian mobile number in E.164.
      pattern: '^\+234[789][01][0-9]{8}$'
      examples: ['+2348031234567']
    Email:
      type: string
      format: email
      maxLength: 254
    Nemtag:
      type: string
      description: Unique handle for receiving money, without the leading `@`.
      pattern: '^[a-z][a-z0-9_]{2,19}$'
      examples: ['tolu_a']
    Nuban:
      type: string
      description: 10-digit NUBAN account number.
      pattern: '^[0-9]{10}$'
    BankCode:
      type: string
      description: CBN bank code.
      pattern: '^[0-9]{3,6}$'
    Pin:
      type: string
      description: 4-digit transaction PIN. Only sent over TLS; stored as an Argon2id hash.
      pattern: '^[0-9]{4}$'
      writeOnly: true
    KycTier:
      type: integer
      enum: [1, 2, 3]
    KycStatus:
      type: string
      enum: [not_started, pending_review, approved, rejected, resubmit]
    Platform:
      type: string
      enum: [ios, android, web]
    PageInfo:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to fetch the next page; `null` on the last page.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: |
            Stable machine-readable error code. Common codes: `validation_failed`,
            `insufficient_funds`, `limit_exceeded`, `kyc_tier_required`, `weak_pin`,
            `pin_locked`, `invalid_otp`, `otp_expired`, `idempotency_conflict`,
            `invalid_signature`, `step_up_required`, `account_frozen`,
            `outgoing_blocked`, `paid_feature_required`, `rate_limited`.
          pattern: '^[a-z][a-z0-9_]*$'
        request_id:
          type: string
        errors:
          type: array
          description: Field-level validation errors.
          items:
            $ref: '#/components/schemas/FieldError'
        feature:
          type: string
          description: The gated feature, present when `code` is `paid_feature_required`.
        retry_at:
          $ref: '#/components/schemas/Timestamp'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON Pointer to the invalid field.
        code:
          type: string
        message:
          type: string
    Health:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        time:
          $ref: '#/components/schemas/Timestamp'

    # ------------------------------------------------------------ auth
    Consent:
      type: object
      required: [terms_version, privacy_version, accepted_at]
      description: NDPA 2023 consent record.
      properties:
        terms_version:
          type: string
        privacy_version:
          type: string
        accepted_at:
          $ref: '#/components/schemas/Timestamp'
    SignupRequest:
      type: object
      required: [first_name, last_name, email, phone, date_of_birth, consent]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 50
        last_name:
          type: string
          minLength: 1
          maxLength: 50
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        date_of_birth:
          $ref: '#/components/schemas/Date'
        consent:
          $ref: '#/components/schemas/Consent'
    OtpChallenge:
      type: object
      required:
        [
          challenge_id,
          channel,
          destination_masked,
          expires_at,
          resend_available_at,
          attempts_remaining,
        ]
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        channel:
          type: string
          description: SMS needs a paid provider, so only email is live.
          enum: [email]
        destination_masked:
          type: string
          examples: ['t***@gmail.com']
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        resend_available_at:
          $ref: '#/components/schemas/Timestamp'
        attempts_remaining:
          type: integer
          minimum: 0
          maximum: 5
    SignupStarted:
      type: object
      required: [signup_id, otp]
      properties:
        signup_id:
          $ref: '#/components/schemas/Uuid'
        otp:
          $ref: '#/components/schemas/OtpChallenge'
    OtpVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    OtpVerified:
      type: object
      required: [verification_token, expires_at]
      properties:
        verification_token:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    OtpResendRequest:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
    Password:
      type: string
      minLength: 10
      maxLength: 128
      writeOnly: true
      description: Checked for strength and known-breached patterns (AUTH-3); stored as Argon2id.
    DeviceRegistration:
      type: object
      required: [name, platform, public_key]
      properties:
        name:
          type: string
          maxLength: 60
          examples: ["Tolu's iPhone"]
        platform:
          $ref: '#/components/schemas/Platform'
        public_key:
          type: string
          description: Base64url raw 32-byte Ed25519 public key.
          pattern: '^[A-Za-z0-9_-]{43}$'
        app_version:
          type: string
        hardware_backed:
          type: boolean
          description: False on the web demo, where the key lives in memory.
    SignupCompleteRequest:
      type: object
      required: [signup_id, verification_token, password, device]
      properties:
        signup_id:
          $ref: '#/components/schemas/Uuid'
        verification_token:
          type: string
        password:
          $ref: '#/components/schemas/Password'
        device:
          $ref: '#/components/schemas/DeviceRegistration'
    AuthSession:
      type: object
      required:
        [
          access_token,
          access_token_expires_at,
          refresh_token,
          refresh_token_expires_at,
          token_type,
          user,
          device,
        ]
      properties:
        access_token:
          type: string
        access_token_expires_at:
          $ref: '#/components/schemas/Timestamp'
        refresh_token:
          type: string
        refresh_token_expires_at:
          $ref: '#/components/schemas/Timestamp'
        token_type:
          type: string
          enum: [Bearer]
        user:
          $ref: '#/components/schemas/User'
        device:
          $ref: '#/components/schemas/Device'
    LoginRequest:
      type: object
      required: [identifier, password]
      description: Send `device_id` from a trusted device, or `device` to bind a new one.
      properties:
        identifier:
          type: string
          description: Email or +234 phone number.
          maxLength: 254
        password:
          $ref: '#/components/schemas/Password'
        device_id:
          $ref: '#/components/schemas/Uuid'
        device:
          $ref: '#/components/schemas/DeviceRegistration'
    DeviceChallengeRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
    DeviceChallenge:
      type: object
      required: [challenge_id, nonce, expires_at]
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        nonce:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    DeviceLoginRequest:
      type: object
      required: [device_id, challenge_id, signature]
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        signature:
          type: string
          description: Base64url Ed25519 signature over the nonce.
          pattern: '^[A-Za-z0-9_-]+$'
    DemoSessionRequest:
      type: object
      properties:
        persona:
          type: string
          description: Which seeded persona to load.
          enum: [tolu, mama_ngozi, emeka, bisi]
          default: tolu
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      properties:
        all_devices:
          type: boolean
          default: false
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    ResetPasswordRequest:
      type: object
      required: [challenge_id, code, new_password]
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        new_password:
          $ref: '#/components/schemas/Password'
    StepUpPurpose:
      type: string
      enum:
        - transfer
        - new_beneficiary
        - device_bind
        - pin_reset
        - card_reveal
        - unfreeze
        - limit_increase
        - account_deletion
    StepUpMethod:
      type: string
      enum: [email_otp, security_question, pin, device_signature]
    StepUpStartRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          $ref: '#/components/schemas/StepUpPurpose'
        resource_id:
          $ref: '#/components/schemas/Uuid'
    StepUpChallenge:
      type: object
      required: [step_up_id, purpose, methods, expires_at]
      properties:
        step_up_id:
          $ref: '#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/StepUpPurpose'
        methods:
          type: array
          description: Every method listed must be passed.
          items:
            $ref: '#/components/schemas/StepUpMethod'
        security_question:
          type: [string, 'null']
        otp:
          oneOf:
            - $ref: '#/components/schemas/OtpChallenge'
            - type: 'null'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    StepUpVerifyRequest:
      type: object
      properties:
        otp_code:
          type: string
          pattern: '^[0-9]{6}$'
        security_answer:
          type: string
          writeOnly: true
          maxLength: 100
        pin:
          $ref: '#/components/schemas/Pin'
        signature:
          type: string
          description: Device signature over `step_up_id`.
    StepUpToken:
      type: object
      required: [step_up_token, purpose, expires_at]
      properties:
        step_up_token:
          type: string
        purpose:
          $ref: '#/components/schemas/StepUpPurpose'
        expires_at:
          $ref: '#/components/schemas/Timestamp'

    # ------------------------------------------------------------ users
    User:
      type: object
      required:
        [
          id,
          first_name,
          last_name,
          email,
          phone,
          date_of_birth,
          nemtag,
          kyc_tier,
          kyc_status,
          has_pin,
          is_demo,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        first_name:
          type: string
        last_name:
          type: string
        preferred_name:
          type: [string, 'null']
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        date_of_birth:
          $ref: '#/components/schemas/Date'
        nemtag:
          oneOf:
            - $ref: '#/components/schemas/Nemtag'
            - type: 'null'
        avatar_url:
          type: [string, 'null']
          format: uri
        kyc_tier:
          $ref: '#/components/schemas/KycTier'
        kyc_status:
          $ref: '#/components/schemas/KycStatus'
        has_pin:
          type: boolean
        is_demo:
          type: boolean
          description: Demo personas show the "Demo money" badge (DEMO-2).
        is_dependant:
          type: boolean
          description: True for family dependants, who get kid mode (FAM-1).
        created_at:
          $ref: '#/components/schemas/Timestamp'
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        preferred_name:
          type: [string, 'null']
          maxLength: 50
    NemtagAvailability:
      type: object
      required: [nemtag, available, suggestions]
      properties:
        nemtag:
          $ref: '#/components/schemas/Nemtag'
        available:
          type: boolean
        suggestions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Nemtag'
    SetNemtagRequest:
      type: object
      required: [nemtag]
      properties:
        nemtag:
          $ref: '#/components/schemas/Nemtag'
    SetPinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          $ref: '#/components/schemas/Pin'
    VerifyPinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          $ref: '#/components/schemas/Pin'
    PinVerification:
      type: object
      required: [valid, attempts_remaining, locked_until]
      properties:
        valid:
          type: boolean
        attempts_remaining:
          type: integer
          minimum: 0
          maximum: 5
        locked_until:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    # ------------------------------------------------------------ devices
    Device:
      type: object
      required:
        [
          id,
          name,
          platform,
          current,
          trusted,
          hardware_backed,
          key_fingerprint,
          bound_at,
          last_seen_at,
          cool_off_until,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        current:
          type: boolean
          description: True for the device making this request.
        trusted:
          type: boolean
          description: False while the new-device cool-off is running.
        hardware_backed:
          type: boolean
        key_fingerprint:
          type: string
          description: First 16 hex characters of SHA-256 of the public key.
          pattern: '^[0-9a-f]{16}$'
        bound_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        cool_off_until:
          description: Reduced outgoing limits apply until this time (AUTH-8).
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        location_hint:
          type: [string, 'null']
          description: Coarse city from the IP, e.g. "Lagos, NG".
    DeviceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    # ------------------------------------------------------------ accounts
    AccountKind:
      type: string
      description: The NGN current account, or a foreign-currency wallet.
      enum: [ngn_current, fx_wallet]
    AccountStatus:
      type: string
      enum: [active, frozen, closed]
    NubanDetails:
      type: object
      required: [scheme, bank_name, bank_code, account_number, account_name, demo]
      properties:
        scheme:
          type: string
          const: nuban
        bank_name:
          type: string
        bank_code:
          $ref: '#/components/schemas/BankCode'
        account_number:
          $ref: '#/components/schemas/Nuban'
        account_name:
          type: string
        demo:
          type: boolean
    UsAchDetails:
      type: object
      required:
        [scheme, bank_name, account_number, routing_number, account_type, account_name, demo]
      properties:
        scheme:
          type: string
          const: us_ach
        bank_name:
          type: string
        account_number:
          type: string
          pattern: '^[0-9]{8,17}$'
        routing_number:
          type: string
          pattern: '^[0-9]{9}$'
        account_type:
          type: string
          enum: [checking]
        account_name:
          type: string
        demo:
          type: boolean
    UkFpsDetails:
      type: object
      required: [scheme, bank_name, sort_code, account_number, account_name, demo]
      properties:
        scheme:
          type: string
          const: uk_fps
        bank_name:
          type: string
        sort_code:
          type: string
          pattern: '^[0-9]{2}-[0-9]{2}-[0-9]{2}$'
        account_number:
          type: string
          pattern: '^[0-9]{8}$'
        account_name:
          type: string
        demo:
          type: boolean
    IbanDetails:
      type: object
      required: [scheme, bank_name, iban, bic, account_name, demo]
      properties:
        scheme:
          type: string
          const: iban
        bank_name:
          type: string
        iban:
          type: string
          pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'
        bic:
          type: string
          pattern: '^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$'
        account_name:
          type: string
        demo:
          type: boolean
    ReceivingDetails:
      description: How to pay into the account. Foreign details are simulated and labelled "Demo details" (ACC-2).
      oneOf:
        - $ref: '#/components/schemas/NubanDetails'
        - $ref: '#/components/schemas/UsAchDetails'
        - $ref: '#/components/schemas/UkFpsDetails'
        - $ref: '#/components/schemas/IbanDetails'
      discriminator:
        propertyName: scheme
        mapping:
          nuban: '#/components/schemas/NubanDetails'
          us_ach: '#/components/schemas/UsAchDetails'
          uk_fps: '#/components/schemas/UkFpsDetails'
          iban: '#/components/schemas/IbanDetails'
    Account:
      type: object
      required:
        [
          id,
          currency,
          kind,
          status,
          ledger_balance,
          available_balance,
          receiving_details,
          opened_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        kind:
          $ref: '#/components/schemas/AccountKind'
        status:
          $ref: '#/components/schemas/AccountStatus'
        nickname:
          type: [string, 'null']
        ledger_balance:
          $ref: '#/components/schemas/Money'
        available_balance:
          description: Ledger balance minus active holds. Never negative.
          $ref: '#/components/schemas/Money'
        max_balance:
          description: KYC tier balance cap, or null when unlimited.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        receiving_details:
          $ref: '#/components/schemas/ReceivingDetails'
        opened_at:
          $ref: '#/components/schemas/Timestamp'
    AccountList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    OpenAccountRequest:
      type: object
      required: [currency]
      properties:
        currency:
          type: string
          enum: [USD, GBP, EUR]
    HoldReason:
      type: string
      enum:
        [
          card_authorization,
          pending_transfer,
          delayed_transfer,
          fraud_review,
          ajo_contribution,
          dispute,
        ]
    Hold:
      type: object
      required: [id, account_id, amount, reason, reference, created_at, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          $ref: '#/components/schemas/HoldReason'
        reference:
          type: string
        description:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    HoldList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Hold'
        total:
          $ref: '#/components/schemas/Money'

    # ------------------------------------------------------------ transactions
    TransactionType:
      type: string
      enum:
        - transfer_in
        - transfer_out
        - card_payment
        - card_refund
        - bill_payment
        - fx_conversion
        - savings
        - ajo
        - loan_disbursement
        - loan_repayment
        - interest
        - fee
        - levy
        - reversal
        - deposit
        - dispute_refund
    TransactionStatus:
      type: string
      enum: [pending, completed, failed, reversed]
    Direction:
      type: string
      enum: [credit, debit]
    Category:
      type: string
      enum:
        - food
        - groceries
        - transport
        - airtime_data
        - bills_utilities
        - shopping
        - entertainment
        - subscriptions
        - health
        - education
        - rent_housing
        - family
        - transfers
        - salary_income
        - savings
        - fees_charges
        - cash
        - other
    CategorySource:
      type: string
      description: Who set the category. `model` carries an AI badge (AI-3).
      enum: [rules, model, user]
    Counterparty:
      type: object
      required: [name]
      properties:
        name:
          type: string
        nemtag:
          type: [string, 'null']
        bank_name:
          type: [string, 'null']
        account_number_masked:
          type: [string, 'null']
          examples: ['******4821']
        merchant_id:
          type: [string, 'null']
    Transaction:
      type: object
      required:
        [
          id,
          account_id,
          type,
          direction,
          status,
          amount,
          narration,
          reference,
          category,
          category_source,
          counterparty,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/TransactionType'
        direction:
          $ref: '#/components/schemas/Direction'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        amount:
          description: Always positive; `direction` gives the sign.
          $ref: '#/components/schemas/Money'
        fee:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        balance_after:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        narration:
          type: string
        reference:
          type: string
          examples: ['NEM20261017A8F3K2']
        category:
          $ref: '#/components/schemas/Category'
        category_source:
          $ref: '#/components/schemas/CategorySource'
        counterparty:
          $ref: '#/components/schemas/Counterparty'
        transfer_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        card_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    TimelineEvent:
      type: object
      required: [status, label, at]
      properties:
        status:
          type: string
        label:
          type: string
          examples: ['At recipient bank']
        at:
          $ref: '#/components/schemas/Timestamp'
        detail:
          type: [string, 'null']
    FeeLine:
      type: object
      required: [code, label, amount]
      properties:
        code:
          type: string
          enum: [transfer_fee, emtl, fx_spread, fx_fee, card_fee, bill_fee, early_break_penalty]
        label:
          type: string
          examples: ['Electronic Money Transfer Levy']
        amount:
          $ref: '#/components/schemas/Money'
    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required: [timeline, fees, journal_entry_id, can_dispute, can_repeat]
          properties:
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/TimelineEvent'
            fees:
              type: array
              items:
                $ref: '#/components/schemas/FeeLine'
            journal_entry_id:
              $ref: '#/components/schemas/Uuid'
            can_dispute:
              type: boolean
            can_repeat:
              type: boolean
            dispute_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
    TransactionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          $ref: '#/components/schemas/PageInfo'
    UpdateTransactionRequest:
      type: object
      required: [category]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        apply_to_similar:
          type: boolean
          default: false
          description: Also recategorise past and future transactions with this counterparty.
    ReceiptParty:
      type: object
      required: [name, account_number_masked, bank_name]
      properties:
        name:
          type: string
        account_number_masked:
          type: string
        bank_name:
          type: string
    Receipt:
      type: object
      required:
        [
          transaction_id,
          reference,
          status,
          amount,
          fee,
          from,
          to,
          narration,
          created_at,
          verification_code,
        ]
      properties:
        transaction_id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        status:
          $ref: '#/components/schemas/TransactionStatus'
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        from:
          $ref: '#/components/schemas/ReceiptParty'
        to:
          $ref: '#/components/schemas/ReceiptParty'
        narration:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        verification_code:
          type: string

    # ------------------------------------------------------------ statements
    StatementRequest:
      type: object
      required: [account_id, from, to]
      description: Periods up to 12 months.
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'
    Statement:
      type: object
      required: [id, account_id, currency, period_from, period_to, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        period_from:
          $ref: '#/components/schemas/Date'
        period_to:
          $ref: '#/components/schemas/Date'
        status:
          type: string
          enum: [generating, ready, failed]
        opening_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        closing_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        sha256:
          type: [string, 'null']
          description: Hash of the PDF, printed on it and checked by the verification page.
          pattern: '^[0-9a-f]{64}$'
        verification_code:
          type: [string, 'null']
          pattern: '^[A-Z0-9]{12}$'
        verification_url:
          type: [string, 'null']
          format: uri
        created_at:
          $ref: '#/components/schemas/Timestamp'
    StatementPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Statement'
        page:
          $ref: '#/components/schemas/PageInfo'
    StatementVerification:
      type: object
      required:
        [
          valid,
          account_name_masked,
          account_number_masked,
          currency,
          period_from,
          period_to,
          sha256,
          issued_at,
          demo,
        ]
      properties:
        valid:
          type: boolean
        account_name_masked:
          type: string
          examples: ['T*** A******']
        account_number_masked:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        period_from:
          $ref: '#/components/schemas/Date'
        period_to:
          $ref: '#/components/schemas/Date'
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        issued_at:
          $ref: '#/components/schemas/Timestamp'
        demo:
          type: boolean
          description: Always true in v1; the page carries the demo disclaimer.

    # ------------------------------------------------------------ transfers
    Bank:
      type: object
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/BankCode'
        name:
          type: string
        short_name:
          type: [string, 'null']
        logo_url:
          type: [string, 'null']
          format: uri
    BankList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Bank'
    NemPayeeQuery:
      type: object
      required: [kind, query]
      properties:
        kind:
          type: string
          const: nem
        query:
          type: string
          description: '@nemtag, +234 phone or Nem account number.'
          maxLength: 30
    BankPayeeQuery:
      type: object
      required: [kind, bank_code, account_number]
      properties:
        kind:
          type: string
          const: bank
        bank_code:
          $ref: '#/components/schemas/BankCode'
        account_number:
          $ref: '#/components/schemas/Nuban'
        expected_name:
          type: string
          description: The name the customer typed, compared by Confirmation of Payee.
          maxLength: 100
    PayeeQuery:
      oneOf:
        - $ref: '#/components/schemas/NemPayeeQuery'
        - $ref: '#/components/schemas/BankPayeeQuery'
      discriminator:
        propertyName: kind
        mapping:
          nem: '#/components/schemas/NemPayeeQuery'
          bank: '#/components/schemas/BankPayeeQuery'
    NameMatch:
      type: object
      required: [result, confidence]
      description: Confirmation of Payee outcome.
      properties:
        result:
          type: string
          enum: [match, close_match, no_match]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        expected_name:
          type: [string, 'null']
    ResolvedPayee:
      type: object
      required: [kind, name, bank_code, bank_name, account_number, is_saved_beneficiary]
      properties:
        kind:
          type: string
          enum: [nem, bank]
        name:
          type: string
        nemtag:
          type: [string, 'null']
        user_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        avatar_url:
          type: [string, 'null']
          format: uri
        bank_code:
          $ref: '#/components/schemas/BankCode'
        bank_name:
          type: string
        account_number:
          $ref: '#/components/schemas/Nuban'
        name_match:
          oneOf:
            - $ref: '#/components/schemas/NameMatch'
            - type: 'null'
        is_saved_beneficiary:
          type: boolean
        beneficiary_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    NemDestination:
      type: object
      required: [kind, account_number]
      properties:
        kind:
          type: string
          const: nem
        account_number:
          $ref: '#/components/schemas/Nuban'
    BankDestination:
      type: object
      required: [kind, bank_code, account_number, account_name]
      properties:
        kind:
          type: string
          const: bank
        bank_code:
          $ref: '#/components/schemas/BankCode'
        account_number:
          $ref: '#/components/schemas/Nuban'
        account_name:
          type: string
          description: The name returned by Confirmation of Payee.
    BeneficiaryDestination:
      type: object
      required: [kind, beneficiary_id]
      properties:
        kind:
          type: string
          const: beneficiary
        beneficiary_id:
          $ref: '#/components/schemas/Uuid'
    TransferDestination:
      oneOf:
        - $ref: '#/components/schemas/NemDestination'
        - $ref: '#/components/schemas/BankDestination'
        - $ref: '#/components/schemas/BeneficiaryDestination'
      discriminator:
        propertyName: kind
        mapping:
          nem: '#/components/schemas/NemDestination'
          bank: '#/components/schemas/BankDestination'
          beneficiary: '#/components/schemas/BeneficiaryDestination'
    TransferQuoteRequest:
      type: object
      required: [source_account_id, destination, amount]
      properties:
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        destination:
          $ref: '#/components/schemas/TransferDestination'
        amount:
          $ref: '#/components/schemas/Money'
    LimitStatus:
      type: object
      required: [kyc_tier, daily_limit, used_today, remaining_today, self_set, cool_off_active]
      properties:
        kyc_tier:
          $ref: '#/components/schemas/KycTier'
        daily_limit:
          description: The lower of the KYC cap, the self-set limit and any cool-off limit.
          $ref: '#/components/schemas/Money'
        used_today:
          $ref: '#/components/schemas/Money'
        remaining_today:
          $ref: '#/components/schemas/Money'
        self_set:
          type: boolean
          description: True when the customer's own limit (SEC-3) is the binding one.
        cool_off_active:
          type: boolean
    CoolingOff:
      type: object
      required: [reason, delay_minutes, step_up_skips_delay]
      description: New-beneficiary cooling-off (TRF-8).
      properties:
        reason:
          type: string
          enum: [new_beneficiary, new_device]
        delay_minutes:
          type: integer
          minimum: 0
        step_up_skips_delay:
          type: boolean
    TransferQuote:
      type: object
      required: [quote_id, amount, fee, fees, total_debit, limits, cooling_off, rail, expires_at]
      properties:
        quote_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          description: Sum of `fees`.
          $ref: '#/components/schemas/Money'
        fees:
          type: array
          items:
            $ref: '#/components/schemas/FeeLine'
        total_debit:
          $ref: '#/components/schemas/Money'
        limits:
          $ref: '#/components/schemas/LimitStatus'
        cooling_off:
          oneOf:
            - $ref: '#/components/schemas/CoolingOff'
            - type: 'null'
        rail:
          $ref: '#/components/schemas/TransferRail'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    TransferRail:
      type: string
      description: '`internal` posts in one ledger transaction; `interbank` runs the sandbox NIP saga.'
      enum: [internal, interbank]
    CreateTransferRequest:
      type: object
      required: [source_account_id, destination, amount]
      properties:
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        destination:
          $ref: '#/components/schemas/TransferDestination'
        amount:
          $ref: '#/components/schemas/Money'
        narration:
          type: string
          maxLength: 100
        quote_id:
          description: The quote the customer saw; rejected with 409 `quote_expired` if stale.
          $ref: '#/components/schemas/Uuid'
        save_beneficiary:
          type: boolean
          default: false
        category:
          $ref: '#/components/schemas/Category'
    TransferStatus:
      type: string
      description: |
        `created → risk_checked → processing → completed | failed → reversed`, plus
        `pending_step_up`, `delayed` (cooling-off), `held_for_review`, `rejected` and `cancelled`.
      enum:
        - created
        - risk_checked
        - pending_step_up
        - delayed
        - held_for_review
        - processing
        - completed
        - failed
        - reversed
        - rejected
        - cancelled
    RiskDecision:
      type: string
      enum: [allow, step_up, hold]
    RiskReason:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          examples: ['new_device', 'amount_unusual', 'new_beneficiary', 'velocity']
        severity:
          type: string
          enum: [low, medium, high]
        message:
          type: string
          description: Plain-language reason shown to the customer.
    RiskAssessment:
      type: object
      required: [decision, score, reasons, model_version]
      description: Rules plus the fraud model (AI-1). Scores are 0 (safe) to 1 (risky).
      properties:
        decision:
          $ref: '#/components/schemas/RiskDecision'
        score:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RiskReason'
        model_version:
          type: string
    TransferParty:
      type: object
      required: [name, bank_code, bank_name, account_number_masked]
      properties:
        name:
          type: string
        nemtag:
          type: [string, 'null']
        bank_code:
          $ref: '#/components/schemas/BankCode'
        bank_name:
          type: string
        account_number_masked:
          type: string
    Reversal:
      type: object
      required: [reason, reversed_at, transaction_id]
      properties:
        reason:
          type: string
        reversed_at:
          $ref: '#/components/schemas/Timestamp'
        transaction_id:
          $ref: '#/components/schemas/Uuid'
    Transfer:
      type: object
      required:
        [
          id,
          reference,
          status,
          rail,
          source_account_id,
          recipient,
          amount,
          fee,
          total_debit,
          narration,
          risk,
          timeline,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        status:
          $ref: '#/components/schemas/TransferStatus'
        rail:
          $ref: '#/components/schemas/TransferRail'
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        recipient:
          $ref: '#/components/schemas/TransferParty'
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        total_debit:
          $ref: '#/components/schemas/Money'
        narration:
          type: string
        risk:
          oneOf:
            - $ref: '#/components/schemas/RiskAssessment'
            - type: 'null'
        step_up_id:
          description: Present when `status` is `pending_step_up`.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        release_at:
          description: When a `delayed` transfer will go out.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        reversal:
          oneOf:
            - $ref: '#/components/schemas/Reversal'
            - type: 'null'
        transaction_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TransferPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
        page:
          $ref: '#/components/schemas/PageInfo'
    InternationalTransferRequest:
      type: object
      required:
        [
          source_account_id,
          amount,
          recipient_name,
          recipient_country,
          recipient_iban_or_account,
          purpose,
        ]
      properties:
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Money'
        recipient_name:
          type: string
        recipient_country:
          type: string
          pattern: '^[A-Z]{2}$'
        recipient_iban_or_account:
          type: string
        recipient_bic:
          type: string
        purpose:
          type: string
          enum: [family_support, education, medical, business, other]
    ScheduleFrequency:
      type: string
      enum: [once, daily, weekly, monthly]
    ScheduledRun:
      type: object
      required: [at, status]
      properties:
        at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/TransferStatus'
        transfer_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    ScheduledTransfer:
      type: object
      required:
        [
          id,
          source_account_id,
          recipient,
          amount,
          narration,
          frequency,
          status,
          next_run_at,
          run_count,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        recipient:
          $ref: '#/components/schemas/TransferParty'
        amount:
          $ref: '#/components/schemas/Money'
        narration:
          type: string
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        status:
          type: string
          enum: [active, paused, cancelled, completed]
        next_run_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        ends_on:
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        run_count:
          type: integer
          minimum: 0
        last_run:
          oneOf:
            - $ref: '#/components/schemas/ScheduledRun'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ScheduledTransferPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledTransfer'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateScheduledTransferRequest:
      type: object
      required: [source_account_id, destination, amount, frequency, start_at]
      properties:
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        destination:
          $ref: '#/components/schemas/TransferDestination'
        amount:
          $ref: '#/components/schemas/Money'
        narration:
          type: string
          maxLength: 100
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        start_at:
          $ref: '#/components/schemas/Timestamp'
        ends_on:
          $ref: '#/components/schemas/Date'
    UpdateScheduledTransferRequest:
      type: object
      minProperties: 1
      properties:
        status:
          type: string
          enum: [active, paused]
        amount:
          $ref: '#/components/schemas/Money'
        next_run_at:
          $ref: '#/components/schemas/Timestamp'

    # ------------------------------------------------------------ beneficiaries
    Beneficiary:
      type: object
      required:
        [
          id,
          kind,
          name,
          bank_code,
          bank_name,
          account_number,
          favourite,
          cooling_off_until,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [nem, bank]
        name:
          type: string
        nickname:
          type: [string, 'null']
        nemtag:
          type: [string, 'null']
        bank_code:
          $ref: '#/components/schemas/BankCode'
        bank_name:
          type: string
        account_number:
          $ref: '#/components/schemas/Nuban'
        favourite:
          type: boolean
        cooling_off_until:
          description: Large first transfers need step-up or wait until this time.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_paid_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    BeneficiaryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Beneficiary'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateBeneficiaryRequest:
      type: object
      required: [destination]
      properties:
        destination:
          oneOf:
            - $ref: '#/components/schemas/NemDestination'
            - $ref: '#/components/schemas/BankDestination'
          discriminator:
            propertyName: kind
            mapping:
              nem: '#/components/schemas/NemDestination'
              bank: '#/components/schemas/BankDestination'
        nickname:
          type: string
          maxLength: 40
        favourite:
          type: boolean
          default: false
    UpdateBeneficiaryRequest:
      type: object
      minProperties: 1
      properties:
        nickname:
          type: [string, 'null']
          maxLength: 40
        favourite:
          type: boolean

    # ------------------------------------------------------------ money requests
    PartySummary:
      type: object
      required: [user_id, name, nemtag]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        nemtag:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
          format: uri
    MoneyRequestDirection:
      type: string
      enum: [incoming, outgoing]
    MoneyRequestStatus:
      type: string
      enum: [pending, paid, declined, cancelled, expired]
    MoneyRequest:
      type: object
      required: [id, direction, requester, payer, amount, note, status, created_at, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        direction:
          description: Relative to the signed-in customer.
          $ref: '#/components/schemas/MoneyRequestDirection'
        requester:
          $ref: '#/components/schemas/PartySummary'
        payer:
          $ref: '#/components/schemas/PartySummary'
        amount:
          $ref: '#/components/schemas/Money'
        note:
          type: string
        status:
          $ref: '#/components/schemas/MoneyRequestStatus'
        split_bill_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        transfer_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        responded_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MoneyRequestPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MoneyRequest'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateMoneyRequestRequest:
      type: object
      required: [payer_nemtag, amount]
      properties:
        payer_nemtag:
          $ref: '#/components/schemas/Nemtag'
        amount:
          $ref: '#/components/schemas/Money'
        note:
          type: string
          maxLength: 100
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    PayFromAccountRequest:
      type: object
      required: [source_account_id]
      properties:
        source_account_id:
          $ref: '#/components/schemas/Uuid'
    SplitShare:
      type: object
      required: [participant, amount, status]
      properties:
        participant:
          $ref: '#/components/schemas/PartySummary'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/MoneyRequestStatus'
        money_request_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        last_reminded_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    SplitBill:
      type: object
      required: [id, title, total, split, shares, paid_total, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        total:
          $ref: '#/components/schemas/Money'
        split:
          type: string
          enum: [equal, custom]
        shares:
          type: array
          items:
            $ref: '#/components/schemas/SplitShare'
        paid_total:
          $ref: '#/components/schemas/Money'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    SplitBillPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SplitBill'
        page:
          $ref: '#/components/schemas/PageInfo'
    SplitParticipant:
      type: object
      required: [nemtag]
      properties:
        nemtag:
          $ref: '#/components/schemas/Nemtag'
        amount:
          description: Required when `split` is `custom`.
          $ref: '#/components/schemas/Money'
    CreateSplitBillRequest:
      type: object
      required: [title, total, split, participants]
      properties:
        title:
          type: string
          maxLength: 60
        total:
          $ref: '#/components/schemas/Money'
        split:
          type: string
          enum: [equal, custom]
        include_self:
          type: boolean
          default: true
          description: |
            Count the creator as a participant when splitting equally. Equal splits give any
            remainder kobo to the creator, so the shares always add up to the total.
        participants:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/SplitParticipant'

    # ------------------------------------------------------------ payment links
    PaymentLinkAmountMode:
      type: string
      enum: [fixed, open]
    PaymentLink:
      type: object
      required:
        [
          id,
          slug,
          url,
          account_id,
          title,
          amount_mode,
          amount,
          status,
          payments_count,
          total_received,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        url:
          type: string
          format: uri
        account_id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        note:
          type: [string, 'null']
        amount_mode:
          $ref: '#/components/schemas/PaymentLinkAmountMode'
        amount:
          description: Set for `fixed` links.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        status:
          type: string
          enum: [active, inactive, expired]
        payments_count:
          type: integer
          minimum: 0
        total_received:
          $ref: '#/components/schemas/Money'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PaymentLinkPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLink'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreatePaymentLinkRequest:
      type: object
      required: [account_id, title, amount_mode]
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          maxLength: 60
        note:
          type: string
          maxLength: 200
        amount_mode:
          $ref: '#/components/schemas/PaymentLinkAmountMode'
        amount:
          description: Required for `fixed` links.
          $ref: '#/components/schemas/Money'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    UpdatePaymentLinkRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 60
        note:
          type: [string, 'null']
          maxLength: 200
        status:
          type: string
          enum: [active, inactive]
    PublicPaymentLink:
      type: object
      required: [slug, title, payee_name, amount_mode, amount, currency, status, demo]
      properties:
        slug:
          type: string
        title:
          type: string
        note:
          type: [string, 'null']
        payee_name:
          type: string
        amount_mode:
          $ref: '#/components/schemas/PaymentLinkAmountMode'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          type: string
          enum: [active, inactive, expired]
        demo:
          type: boolean
    PayPaymentLinkRequest:
      type: object
      required: [source_account_id]
      properties:
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          description: Required for `open` links.
          $ref: '#/components/schemas/Money'
        note:
          type: string
          maxLength: 100

    # ------------------------------------------------------------ qr
    QrCode:
      type: object
      required: [payload, account_id, amount, expires_at, key_id]
      properties:
        payload:
          type: string
          description: '`nem1.<base64url claims>.<base64url server signature>`.'
        account_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        expires_at:
          description: Fixed-amount codes expire after 15 minutes; open codes do not.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        key_id:
          type: string
          description: Which server signing key was used (keys rotate).
    QrDecodeRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: string
          maxLength: 2048
    DecodedQr:
      type: object
      required: [valid, payee, amount, invalid_reason]
      properties:
        valid:
          type: boolean
        invalid_reason:
          type: [string, 'null']
          enum: [expired, bad_signature, unknown_account, not_nem_qr, null]
        payee:
          oneOf:
            - $ref: '#/components/schemas/ResolvedPayee'
            - type: 'null'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'

    # ------------------------------------------------------------ shared (part 2)
    Rate:
      type: string
      description: Decimal exchange rate as a string (never a float), up to 8 decimal places.
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,8})?$'
      examples: ['1612.45']
    BasisPoints:
      type: integer
      description: Hundredths of a percent; 150 = 1.5%.
      minimum: 0
      maximum: 100000
    AiMeta:
      type: object
      required: [feature, model_version, explanation, fallback_used]
      description: Shown behind the AI badge, so every AI result can explain itself (AI-8).
      properties:
        feature:
          type: string
          enum:
            [
              fraud_scoring,
              scam_checker,
              smart_categories,
              forecast,
              credit_scoring,
              assistant,
              id_prefill,
            ]
        model_version:
          type: string
        explanation:
          type: string
        fallback_used:
          type: boolean
          description: True when the rules-only fallback produced the result.
    ReasonCode:
      type: object
      required: [code, impact, message]
      properties:
        code:
          type: string
          examples: ['regular_salary', 'low_account_age']
        impact:
          type: string
          enum: [positive, negative, neutral]
        message:
          type: string
    Attachment:
      type: object
      required: [id, file_name, content_type, size_bytes, url, uploaded_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        file_name:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        size_bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        url:
          type: string
          format: uri
          description: Short-lived signed URL.
        uploaded_at:
          $ref: '#/components/schemas/Timestamp'
    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG or PDF, at most 5 MB.
        caption:
          type: string
          maxLength: 200

    # ------------------------------------------------------------ fx
    FxPairCode:
      type: string
      pattern: '^(NGN|USD|GBP|EUR)-(NGN|USD|GBP|EUR)$'
      examples: ['USD-NGN']
    FxRate:
      type: object
      required: [pair, base, quote, mid_rate, buy_rate, sell_rate, spread_bps, source, as_of]
      properties:
        pair:
          $ref: '#/components/schemas/FxPairCode'
        base:
          $ref: '#/components/schemas/CurrencyCode'
        quote:
          $ref: '#/components/schemas/CurrencyCode'
        mid_rate:
          $ref: '#/components/schemas/Rate'
        buy_rate:
          description: Quote currency the customer pays per 1 base unit.
          $ref: '#/components/schemas/Rate'
        sell_rate:
          description: Quote currency the customer receives per 1 base unit.
          $ref: '#/components/schemas/Rate'
        spread_bps:
          $ref: '#/components/schemas/BasisPoints'
        source:
          type: string
          enum: [open_er_api, frankfurter, cache]
        as_of:
          $ref: '#/components/schemas/Timestamp'
    FxRateList:
      type: object
      required: [data, indicative]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FxRate'
        indicative:
          type: boolean
          description: Always true; rates are hourly, not a live market feed.
    FxRatePoint:
      type: object
      required: [at, rate]
      properties:
        at:
          $ref: '#/components/schemas/Timestamp'
        rate:
          $ref: '#/components/schemas/Rate'
    FxRateHistory:
      type: object
      required: [pair, range, points]
      properties:
        pair:
          $ref: '#/components/schemas/FxPairCode'
        range:
          type: string
          enum: [1D, 1W, 1M, 1Y]
        points:
          type: array
          items:
            $ref: '#/components/schemas/FxRatePoint'
    FxQuoteRequest:
      type: object
      required: [from_account_id, to_account_id]
      description: Send exactly one of `sell_amount` or `buy_amount`.
      properties:
        from_account_id:
          $ref: '#/components/schemas/Uuid'
        to_account_id:
          $ref: '#/components/schemas/Uuid'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
    FxQuote:
      type: object
      required:
        [
          quote_id,
          from_account_id,
          to_account_id,
          sell,
          buy,
          rate,
          mid_rate,
          spread_bps,
          fee,
          expires_at,
        ]
      properties:
        quote_id:
          $ref: '#/components/schemas/Uuid'
        from_account_id:
          $ref: '#/components/schemas/Uuid'
        to_account_id:
          $ref: '#/components/schemas/Uuid'
        sell:
          $ref: '#/components/schemas/Money'
        buy:
          description: Rounded down to the minor unit, in the customer's favour never against it.
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/Rate'
        mid_rate:
          $ref: '#/components/schemas/Rate'
        spread_bps:
          $ref: '#/components/schemas/BasisPoints'
        fee:
          $ref: '#/components/schemas/Money'
        expires_at:
          description: 60 seconds after the quote was made.
          $ref: '#/components/schemas/Timestamp'
    FxConversionRequest:
      type: object
      required: [quote_id]
      properties:
        quote_id:
          $ref: '#/components/schemas/Uuid'
    FxConversion:
      type: object
      required:
        [
          id,
          quote_id,
          sell,
          buy,
          rate,
          fee,
          status,
          debit_transaction_id,
          credit_transaction_id,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        quote_id:
          $ref: '#/components/schemas/Uuid'
        sell:
          $ref: '#/components/schemas/Money'
        buy:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/Rate'
        fee:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [completed, failed]
        debit_transaction_id:
          $ref: '#/components/schemas/Uuid'
        credit_transaction_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    FxConversionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FxConversion'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateFxAlertRequest:
      type: object
      required: [pair, direction, target_rate]
      properties:
        pair:
          $ref: '#/components/schemas/FxPairCode'
        direction:
          type: string
          enum: [above, below]
        target_rate:
          $ref: '#/components/schemas/Rate'
    FxAlert:
      type: object
      required: [id, pair, direction, target_rate, status, created_at, triggered_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        pair:
          $ref: '#/components/schemas/FxPairCode'
        direction:
          type: string
          enum: [above, below]
        target_rate:
          $ref: '#/components/schemas/Rate'
        status:
          type: string
          enum: [active, triggered]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        triggered_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    FxAlertList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FxAlert'

    # ------------------------------------------------------------ cards
    CardType:
      type: string
      description: '`single_use` closes after one charge; `merchant_locked` only works at one merchant.'
      enum: [standard, single_use, merchant_locked]
    CardStatus:
      type: string
      enum: [active, frozen, terminated, used]
    SpendLimit:
      type: object
      required: [amount, period]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        period:
          type: string
          enum: [per_transaction, daily, monthly]
    MerchantLock:
      type: object
      required: [merchant_id, merchant_name]
      properties:
        merchant_id:
          type: string
        merchant_name:
          type: string
    CardControls:
      type: object
      required: [spend_limit, online_enabled, international_enabled, merchant_lock]
      properties:
        spend_limit:
          oneOf:
            - $ref: '#/components/schemas/SpendLimit'
            - type: 'null'
        online_enabled:
          type: boolean
        international_enabled:
          type: boolean
        merchant_lock:
          oneOf:
            - $ref: '#/components/schemas/MerchantLock'
            - type: 'null'
    Card:
      type: object
      required:
        [
          id,
          account_id,
          currency,
          type,
          status,
          network,
          last4,
          expiry_month,
          expiry_year,
          name_on_card,
          nickname,
          design,
          controls,
          frozen_by_panic,
          physical,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        currency:
          type: string
          enum: [NGN, USD]
        type:
          $ref: '#/components/schemas/CardType'
        status:
          $ref: '#/components/schemas/CardStatus'
        network:
          type: string
          description: Simulated network branding on a test BIN; not usable outside Nem.
          enum: [nem_verve, nem_visa]
        last4:
          type: string
          pattern: '^[0-9]{4}$'
        expiry_month:
          type: integer
          minimum: 1
          maximum: 12
        expiry_year:
          type: integer
          minimum: 2026
        name_on_card:
          type: string
        nickname:
          type: [string, 'null']
        design:
          type: string
          enum: [volt, noir, mint, coral]
        controls:
          $ref: '#/components/schemas/CardControls'
        frozen_by_panic:
          type: boolean
          description: Unfreezing needs step-up when true.
        physical:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CardList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    CreateCardRequest:
      type: object
      required: [account_id, type]
      properties:
        account_id:
          description: The NGN account or USD wallet the card spends from.
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/CardType'
        nickname:
          type: string
          maxLength: 30
        design:
          type: string
          enum: [volt, noir, mint, coral]
          default: volt
        merchant_lock:
          description: Required for `merchant_locked` cards.
          $ref: '#/components/schemas/MerchantLock'
        spend_limit:
          $ref: '#/components/schemas/SpendLimit'
    PhysicalCardRequest:
      type: object
      required: [account_id, delivery_address]
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        delivery_address:
          $ref: '#/components/schemas/Address'
    UpdateCardRequest:
      type: object
      minProperties: 1
      properties:
        nickname:
          type: [string, 'null']
          maxLength: 30
        spend_limit:
          oneOf:
            - $ref: '#/components/schemas/SpendLimit'
            - type: 'null'
        online_enabled:
          type: boolean
        international_enabled:
          type: boolean
        merchant_lock:
          oneOf:
            - $ref: '#/components/schemas/MerchantLock'
            - type: 'null'
    CardSecrets:
      type: object
      required: [card_id, pan, cvv, expiry_month, expiry_year, visible_until]
      properties:
        card_id:
          $ref: '#/components/schemas/Uuid'
        pan:
          type: string
          description: Luhn-valid 16-digit test PAN.
          pattern: '^[0-9]{16}$'
        cvv:
          type: string
          pattern: '^[0-9]{3}$'
        expiry_month:
          type: integer
          minimum: 1
          maximum: 12
        expiry_year:
          type: integer
        visible_until:
          $ref: '#/components/schemas/Timestamp'
    CardTransactionStatus:
      type: string
      enum: [authorized, settled, reversed, declined]
    CardTransaction:
      type: object
      required:
        [
          id,
          card_id,
          merchant,
          amount,
          billing_amount,
          status,
          decline_reason,
          authorized_at,
          settled_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        card_id:
          $ref: '#/components/schemas/Uuid'
        merchant:
          type: object
          required: [name, mcc, country]
          properties:
            id:
              type: string
            name:
              type: string
            mcc:
              type: string
              pattern: '^[0-9]{4}$'
            country:
              type: string
              pattern: '^[A-Z]{2}$'
        amount:
          description: In the merchant's currency.
          $ref: '#/components/schemas/Money'
        billing_amount:
          description: In the card's currency.
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/CardTransactionStatus'
        decline_reason:
          type: [string, 'null']
          enum:
            [
              insufficient_funds,
              card_frozen,
              limit_exceeded,
              online_disabled,
              international_disabled,
              merchant_not_allowed,
              card_used,
              null,
            ]
        transaction_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        authorized_at:
          $ref: '#/components/schemas/Timestamp'
        settled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    CardTransactionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardTransaction'
        page:
          $ref: '#/components/schemas/PageInfo'

    # ------------------------------------------------------------ bills
    BillCategory:
      type: string
      enum: [airtime, data, electricity, cable_tv]
    MobileNetwork:
      type: string
      enum: [mtn, airtel, glo, nine_mobile]
    Biller:
      type: object
      required: [id, category, name, requires_validation, has_products]
      properties:
        id:
          type: string
          examples: ['ikeja-electric-prepaid']
        category:
          $ref: '#/components/schemas/BillCategory'
        name:
          type: string
        network:
          oneOf:
            - $ref: '#/components/schemas/MobileNetwork'
            - type: 'null'
        logo_url:
          type: [string, 'null']
          format: uri
        requires_validation:
          type: boolean
          description: Meters and smartcards are validated before paying.
        has_products:
          type: boolean
        min_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    BillerList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Biller'
    BillerProduct:
      type: object
      required: [id, name, amount, validity_days]
      properties:
        id:
          type: string
        name:
          type: string
          examples: ['1.5GB, 30 days']
        amount:
          $ref: '#/components/schemas/Money'
        validity_days:
          type: [integer, 'null']
    BillerProductList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillerProduct'
    DetectNetworkRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
    DetectedNetwork:
      type: object
      required: [phone, network]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        network:
          oneOf:
            - $ref: '#/components/schemas/MobileNetwork'
            - type: 'null'
    BillValidationRequest:
      type: object
      required: [biller_id, customer_id]
      properties:
        biller_id:
          type: string
        customer_id:
          type: string
          description: Meter number or smartcard number.
          maxLength: 20
    BillValidation:
      type: object
      required: [biller_id, customer_id, customer_name]
      properties:
        biller_id:
          type: string
        customer_id:
          type: string
        customer_name:
          type: string
        address:
          type: [string, 'null']
        current_plan:
          type: [string, 'null']
    PayBillRequest:
      type: object
      required: [biller_id, customer_id, amount, source_account_id]
      properties:
        biller_id:
          type: string
        product_id:
          type: string
        customer_id:
          type: string
          description: Phone number, meter number or smartcard number.
          maxLength: 20
        amount:
          $ref: '#/components/schemas/Money'
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        save_as:
          type: string
          description: Save this biller under a nickname.
          maxLength: 30
    BillPayment:
      type: object
      required:
        [
          id,
          reference,
          biller_id,
          biller_name,
          category,
          customer_id,
          amount,
          fee,
          status,
          token,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        biller_id:
          type: string
        biller_name:
          type: string
        category:
          $ref: '#/components/schemas/BillCategory'
        product_name:
          type: [string, 'null']
        customer_id:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [processing, completed, failed, reversed]
        token:
          type: [string, 'null']
          description: Prepaid electricity token, shareable (BILL-2).
          pattern: '^[0-9]{4}(-[0-9]{4}){4}$'
        units:
          type: [string, 'null']
          examples: ['34.6 kWh']
        transaction_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    BillPaymentPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillPayment'
        page:
          $ref: '#/components/schemas/PageInfo'
    SaveBillerRequest:
      type: object
      required: [biller_id, customer_id, nickname]
      properties:
        biller_id:
          type: string
        customer_id:
          type: string
        nickname:
          type: string
          maxLength: 30
    SavedBiller:
      type: object
      required: [id, biller_id, biller_name, category, customer_id, nickname, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        biller_id:
          type: string
        biller_name:
          type: string
        category:
          $ref: '#/components/schemas/BillCategory'
        customer_id:
          type: string
        customer_name:
          type: [string, 'null']
        nickname:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
    SavedBillerList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SavedBiller'
    CreateBillScheduleRequest:
      type: object
      required: [payment, frequency, start_at]
      properties:
        payment:
          $ref: '#/components/schemas/PayBillRequest'
        frequency:
