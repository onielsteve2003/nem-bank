    post:
      tags: [transfers]
      operationId: createScheduledTransfer
      summary: Schedule a transfer
      description: One-off or recurring (daily, weekly, monthly). Signed, because it authorises future debits (TRF-9).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
