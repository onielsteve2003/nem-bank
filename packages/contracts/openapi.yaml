openapi: 3.1.0
info:
  title: Nem Bank API
  version: 1.0.0
  summary: The single source of truth for the Nem Bank HTTP API.
  description: |
    Contract-first: TypeScript types (`openapi-typescript`) and the Go server
    (`oapi-codegen`, Gin strict server) are generated from this file.

    Conventions used by every endpoint:
    - **Money** is `{ "amount_minor": "150000", "currency": "NGN" }`. Minor units are a
      string so JavaScript never loses precision.
    - **Errors** are RFC 9457 `application/problem+json` with a stable `code`.
    - **Lists** use opaque cursors (`cursor`, `limit`, `next_cursor`) and return
      `{ "data": [...], "page": { "next_cursor": ... } }`.
    - **IDs** are UUIDv7; **timestamps** are RFC 3339 in UTC; **dates** are `YYYY-MM-DD`
      in Africa/Lagos.
    - **Money-moving POSTs** require `Idempotency-Key` and a device signature
      (`X-Device-Id`, `X-Device-Signature`, `X-Signature-Timestamp`, `X-Nonce`).
      The signature covers the canonical payload
      `METHOD\npath\ntimestamp\nnonce\nsha256(body)`.
    - **Step-up** actions also require `X-Step-Up-Token`, issued by `POST /v1/auth/step-up/{step_up_id}/verify`.
    - Every response carries `X-Request-Id`; problems repeat it as `request_id`.

    Staff endpoints (`/v1/admin`) use `staffAuth`. `x-roles` lists the staff roles allowed and
    `x-maker-checker: true` marks actions that need a second approver. Developer API keys work on
    the operations that list `apiKeyAuth`, limited by `x-api-key-scope`. Outbound developer
    events are described under `webhooks`.

    All money is simulated. External rails run in sandbox mode.
  contact:
    name: Nem Bank
    url: https://github.com/onielsteve2003/nem-bank
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
    description: Health and service metadata.
  - name: auth
    description: Sign up, login, tokens, password reset and step-up verification (FR-AUTH).
  - name: users
    description: The signed-in customer's profile, @nemtag and transaction PIN.
  - name: devices
    description: Device binding with Ed25519 keys and the new-device cool-off (AUTH-6, AUTH-8).
  - name: accounts
    description: NGN account and USD, GBP, EUR wallets with available vs ledger balances (FR-ACC).
  - name: transactions
    description: Transaction history, detail, categories and receipts (ACC-5 to ACC-7).
  - name: statements
    description: Official PDF statements with a public verification page (ACC-8).
  - name: transfers
    description: Payee lookup, Confirmation of Payee, quotes, transfers and schedules (FR-TRF).
  - name: beneficiaries
    description: Saved recipients with new-beneficiary cooling-off (TRF-8).
  - name: money-requests
    description: Requests between Nem users and split bills (TRF-10, TRF-11).
  - name: payment-links
    description: Shareable payment links and the public pay page (TRF-12).
  - name: qr
    description: Server-signed QR payloads to receive and pay (TRF-13).
  - name: fx
    description: Rates, 60-second quotes, conversions and rate alerts (FR-FX).
  - name: cards
    description: Virtual cards on Nem's simulated processor, controls and reveal (FR-CARD).
  - name: bills
    description: Airtime, data, electricity and cable TV through the simulated biller (FR-BILL).
  - name: savings
    description: Goals, round-ups and locked savings with daily interest (FR-SAV).
  - name: ajo
    description: Digital group savings with ledger-enforced payouts (FR-AJO).
  - name: credit
    description: Explainable eligibility, offers, loans and repayments (FR-CRD).
  - name: insights
    description: Spending, budgets, forecast, subscriptions and the Money Story (FR-INS).
  - name: security
    description: Checkup, sessions, own limits, panic button, duress PIN and scam checker (FR-SEC).
  - name: kyc
    description: Tiered KYC with sandbox BVN/NIN checks and document review (FR-KYC).
  - name: disputes
    description: Disputes with evidence and ledger-posted refunds (FR-DSP).
  - name: support
    description: Realtime support chat and the help center (FR-SUP).
  - name: notifications
    description: Inbox, preferences and Expo push tokens (FR-NOT).
  - name: family
    description: Dependants, allowances, controls and approvals (FR-FAM).
  - name: assistant
    description: Nem Assistant, which prepares actions the customer confirms (AI-6).
  - name: realtime
    description: WebSocket tickets and the event schemas pushed to clients.
  - name: admin-auth
    description: Staff login with mandatory TOTP (ADM-1).
  - name: admin
    description: Staff console — dashboard, customers, KYC, fraud, disputes, support, config, audit and maker-checker (FR-ADM).
  - name: admin-ledger
    description: Ledger explorer, trial balance, reconciliation and manual adjustments (ADM-7).
  - name: admin-simulators
    description: Merchant and Bank Partner simulators (ADM-11).
  - name: demo
    description: Demo Controls for demo personas only (DEMO-1).
  - name: developer
    description: API keys, webhook endpoints, delivery log and sandbox (FR-DEV).
  - name: partners
    description: Signed callbacks from sandbox partners.
security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health
      description: Liveness check. Also used by the uptime monitor to keep the API warm.
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- auth
  /v1/auth/signup:
    post:
      tags: [auth]
      operationId: startSignup
      summary: Start sign-up
      description: Validates the customer's details (18+, +234 phone, consent) and emails a 6-digit OTP (AUTH-1, AUTH-2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Sign-up started; an OTP was emailed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/signup/complete:
    post:
      tags: [auth]
      operationId: completeSignup
      summary: Finish sign-up
      description: Sets the password and binds the first device. Returns a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompleteRequest'
      responses:
        '201':
          description: The account was created and the device bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Verify an email OTP
      description: Codes expire after 10 minutes and allow 5 attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: The code is correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/otp/resend:
    post:
      tags: [auth]
      operationId: resendOtp
      summary: Resend an email OTP
      description: Allowed once the 60-second cooldown in `resend_available_at` has passed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '200':
          description: A new code was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with a password
      description: |
        Email or phone plus password (AUTH-7). Logging in from an unknown device binds it and
        starts the 24-hour new-device cool-off (AUTH-8): `device.cool_off_until` is set and
        the customer's other devices are alerted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/device-challenge:
    post:
      tags: [auth]
      operationId: createDeviceChallenge
      summary: Get a device-login challenge
      description: First step of biometric quick login on a trusted device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceChallengeRequest'
      responses:
        '201':
          description: Sign `nonce` with the device key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceChallenge'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/login/device:
    post:
      tags: [auth]
      operationId: loginWithDevice
      summary: Quick login with the device key
      description: The app unlocks the device key with Face ID or fingerprint and signs the challenge (AUTH-5, AUTH-7).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/demo:
    post:
      tags: [auth]
      operationId: startDemoSession
      summary: Start a demo session
      description: One tap into a seeded persona with 6 months of history (AUTH-11). Demo users are isolated and reset nightly.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionRequest'
      responses:
        '201':
          description: A demo session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate tokens
      description: Refresh tokens rotate on every use. Reusing an old one revokes the whole token family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: The session (or every session) was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Start a password reset
      description: Always returns 202 so the response never reveals whether the email exists (AUTH-9).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: If the email is registered, a code was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Reset the password
      description: Revokes every session and starts the new-device cool-off on all devices.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/auth/step-up:
    post:
      tags: [auth]
      operationId: startStepUp
      summary: Start step-up verification
      description: Asks for extra proof before a sensitive action (risky transfer, unfreeze, PIN reset, card reveal).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpStartRequest'
      responses:
        '201':
          description: The checks the customer must pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/step-up/{step_up_id}/verify:
    post:
      tags: [auth]
      operationId: verifyStepUp
      summary: Complete step-up verification
      parameters:
        - $ref: '#/components/parameters/StepUpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpVerifyRequest'
      responses:
        '200':
          description: Pass `step_up_token` as `X-Step-Up-Token` on the protected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpToken'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- users
  /v1/users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Get my profile
      responses:
        '200':
          description: The signed-in customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      operationId: updateMe
      summary: Update my profile
      description: Legal names change only through KYC; this edits display fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/users/nemtags/{nemtag}/availability:
    get:
      tags: [users]
      operationId: checkNemtag
      summary: Check whether a @nemtag is free
      parameters:
        - name: nemtag
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Nemtag'
      responses:
        '200':
          description: Availability, with suggestions when taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemtagAvailability'
  /v1/users/me/nemtag:
    put:
      tags: [users]
      operationId: setNemtag
      summary: Claim my @nemtag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNemtagRequest'
      responses:
        '200':
          description: The tag is now mine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/users/me/pin:
    put:
      tags: [users]
      operationId: setPin
      summary: Set my transaction PIN
      description: First-time setup only. Weak PINs (1234, 0000, repeated digits, date-of-birth digits) return 422 `weak_pin` (AUTH-4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
      responses:
        '204':
          description: The PIN was set.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/users/me/pin/verify:
    post:
      tags: [users]
      operationId: verifyPin
      summary: Check my transaction PIN
      description: Five wrong tries lock the PIN with escalating backoff (AUTH-4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPinRequest'
      responses:
        '200':
          description: The result and the attempts left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinVerification'
        '423':
          $ref: '#/components/responses/Locked'
  /v1/users/me/pin/reset:
    post:
      tags: [users]
      operationId: resetPin
      summary: Reset my transaction PIN
      description: Needs step-up verification (AUTH-9).
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
      responses:
        '204':
          description: The PIN was replaced.
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------- devices
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List my bound devices
      responses:
        '200':
          description: Every device bound to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
    post:
      tags: [devices]
      operationId: bindDevice
      summary: Bind a new device key
      description: Registers a new Ed25519 public key. Needs step-up and starts the 24-hour cool-off on the new device.
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: The device is bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/devices/{device_id}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device
      description: Removes the device key and ends its sessions (SEC-2).
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '204':
          description: The device was revoked.
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- accounts
  /v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: accounts_read
      summary: List my accounts
      description: The NGN account plus any open foreign-currency wallets.
      responses:
        '200':
          description: All accounts, NGN first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
    post:
      tags: [accounts]
      operationId: openAccount
      summary: Open a foreign-currency wallet
      description: USD, GBP and EUR wallets need KYC Tier 2+ (KYC-7); lower tiers get 403 `kyc_tier_required`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: The wallet was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/accounts/{account_id}:
    get:
      tags: [accounts]
      operationId: getAccount
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: accounts_read
      summary: Get an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account with balances and receiving details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/accounts/{account_id}/holds:
    get:
      tags: [accounts]
      operationId: listAccountHolds
      summary: List active holds
      description: Card authorizations and pending transfers that make up `ledger_balance − available_balance` (ACC-3).
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Active holds, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldList'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- transactions
  /v1/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: transactions_read
      summary: List transactions
      description: Newest first, filterable and searchable (ACC-5).
      parameters:
        - name: account_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: type
          in: query
          description: One or more types, comma-separated.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TransactionType'
        - name: currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: q
          in: query
          description: Free-text search over counterparty, narration and reference.
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/transactions/{transaction_id}:
    get:
      tags: [transactions]
      operationId: getTransaction
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: transactions_read
      summary: Get a transaction
      description: Detail with status timeline, fees and what the customer can do next (ACC-6).
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [transactions]
      operationId: updateTransaction
      summary: Recategorise a transaction
      description: The correction also trains smart categories for this customer (AI-3).
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: The updated transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/transactions/{transaction_id}/receipt:
    get:
      tags: [transactions]
      operationId: getReceipt
      summary: Get a receipt
      description: JSON for the in-app receipt, or a PDF with `Accept application/pdf` (ACC-7).
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- statements
  /v1/statements:
