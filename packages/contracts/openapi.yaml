                $ref: '#/components/schemas/DecodedQr'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ---------------------------------------------------------------- fx
  /v1/fx/rates:
    get:
      tags: [fx]
      operationId: listFxRates
      summary: Current exchange rates
      description: Indicative rates from free sources, cached hourly, with the bank's spread applied (FX-5).
      responses:
        '200':
          description: Buy and sell rates for every supported pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRateList'
  /v1/fx/rates/{pair}/history:
    get:
      tags: [fx]
      operationId: getFxRateHistory
      summary: Rate history for a chart
      parameters:
        - $ref: '#/components/parameters/FxPair'
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [1D, 1W, 1M, 1Y]
      responses:
        '200':
          description: Mid-rate points, oldest first (FX-2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRateHistory'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/fx/quotes:
    post:
      tags: [fx]
      operationId: createFxQuote
      summary: Get a conversion quote
      description: Locks a rate for 60 seconds (FX-1). Give either the amount to sell or the amount to buy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxQuoteRequest'
      responses:
        '201':
          description: The locked quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/fx/conversions:
    get:
      tags: [fx]
      operationId: listFxConversions
      summary: Conversion history
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversions, newest first (FX-4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxConversionPage'
    post:
      tags: [fx]
      operationId: convertCurrency
      summary: Convert at a quoted rate
      description: Posts both legs through the FX position accounts in one ledger entry. An expired quote returns 409 `quote_expired`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxConversionRequest'
      responses:
        '201':
          description: Both balances have been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxConversion'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/fx/alerts:
    get:
      tags: [fx]
      operationId: listFxAlerts
      summary: List rate alerts
      responses:
        '200':
          description: Active and recently triggered alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxAlertList'
    post:
      tags: [fx]
      operationId: createFxAlert
      summary: Create a rate alert
      description: '"Tell me when USD/NGN goes above X" (FX-2). Triggers an `fx.alert_triggered` event.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFxAlertRequest'
      responses:
        '201':
          description: The alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxAlert'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/fx/alerts/{alert_id}:
    delete:
      tags: [fx]
      operationId: deleteFxAlert
      summary: Delete a rate alert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- cards
  /v1/cards:
    get:
      tags: [cards]
      operationId: listCards
      summary: List my cards
      responses:
        '200':
          description: Every card, terminated cards last.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
    post:
      tags: [cards]
      operationId: createCard
      summary: Create a virtual card
      description: Issued by Nem's simulated processor on a test BIN (CARD-1, CARD-7). USD cards need KYC Tier 2+.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '201':
          description: The new card (details hidden until revealed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/cards/physical:
    post:
      tags: [cards]
      operationId: requestPhysicalCard
      summary: Request a physical card
      description: Needs a card manufacturing and delivery partner (CARD-8), so it returns 403 `paid_feature_required`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalCardRequest'
      responses:
        '201':
          description: The card was ordered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '403':
          $ref: '#/components/responses/PaidFeatureRequired'
  /v1/cards/{card_id}:
    get:
      tags: [cards]
      operationId: getCard
      summary: Get a card
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: The card and its controls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [cards]
      operationId: updateCardControls
      summary: Change card controls
      description: Spend limit, online and international toggles, merchant lock and nickname (CARD-4).
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
        '200':
          description: The updated card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/cards/{card_id}/freeze:
    post:
      tags: [cards]
      operationId: freezeCard
      summary: Freeze a card
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: The frozen card. New authorizations are declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/cards/{card_id}/unfreeze:
    post:
      tags: [cards]
      operationId: unfreezeCard
      summary: Unfreeze a card
      description: Cards frozen by the panic button need step-up (SEC-4); send `X-Step-Up-Token` for those.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/OptionalStepUpTokenHeader'
      responses:
        '200':
          description: The active card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/cards/{card_id}/reveal:
    post:
      tags: [cards]
      operationId: revealCard
      summary: Reveal card details
      description: Full PAN and CVV behind biometric step-up. The app hides them after `visible_until` (30 seconds) (CARD-3).
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/StepUpTokenHeader'
      responses:
        '200':
          description: The card secrets. Never cached or logged.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSecrets'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/cards/{card_id}/terminate:
    post:
      tags: [cards]
      operationId: terminateCard
      summary: Terminate a card
      description: Permanent. Pending authorizations still settle (CARD-6).
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The terminated card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/cards/{card_id}/replace:
    post:
      tags: [cards]
      operationId: replaceCard
      summary: Replace a card
      description: Terminates this card and issues a new number with the same controls.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      responses:
        '201':
          description: The replacement card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/cards/{card_id}/transactions:
    get:
      tags: [cards]
      operationId: listCardTransactions
