      operationId: withdrawDispute
      summary: Withdraw a dispute
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: The withdrawn dispute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- support
  /v1/support/conversations:
    get:
      tags: [support]
      operationId: listSupportConversations
      summary: List support chats
      responses:
        '200':
          description: Open chats first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversationList'
    post:
      tags: [support]
      operationId: startSupportConversation
      summary: Start a support chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
      responses:
        '201':
          description: The chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversation'
  /v1/support/conversations/{conversation_id}:
    get:
      tags: [support]
      operationId: getSupportConversation
      summary: Get a support chat
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: The chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversation'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/support/conversations/{conversation_id}/messages:
    get:
      tags: [support]
      operationId: listSupportMessages
      summary: Chat messages
      description: Newest first; new ones arrive as `support.message` events (SUP-1).
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportMessagePage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [support]
      operationId: sendSupportMessage
      summary: Send a chat message
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSupportMessageRequest'
      responses:
        '201':
          description: The sent message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportMessage'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/support/attachments:
    post:
      tags: [support]
      operationId: uploadSupportAttachment
      summary: Upload a chat attachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '201':
          description: Reference it in `attachment_ids`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /v1/help/articles:
    get:
      tags: [support]
      operationId: searchHelpArticles
      summary: Search the help center
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching FAQ articles (SUP-2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpArticleList'
  /v1/help/articles/{slug}:
    get:
      tags: [support]
      operationId: getHelpArticle
      summary: Read a help article
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]{1,80}$'
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpArticle'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- notifications
  /v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Notification inbox
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Newest first, with the unread count (NOT-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
  /v1/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Mark notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '204':
          description: Marked.
  /v1/notifications/preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: Get notification preferences
      responses:
        '200':
          description: Channels per category (NOT-2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
    put:
      tags: [notifications]
      operationId: setNotificationPreferences
      summary: Change notification preferences
      description: Security alerts cannot be switched off entirely; at least one channel stays on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/notifications/push-tokens:
    post:
      tags: [notifications]
      operationId: registerPushToken
      summary: Register an Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRequest'
      responses:
        '204':
          description: Registered for this device.
  /v1/notifications/push-tokens/{device_id}:
    delete:
      tags: [notifications]
      operationId: unregisterPushToken
      summary: Stop push to a device
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '204':
          description: Unregistered.

  # ---------------------------------------------------------------- family
  /v1/family/dependants:
    get:
      tags: [family]
      operationId: listDependants
      summary: List my dependants
      responses:
        '200':
          description: Dependants with balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependantList'
    post:
      tags: [family]
      operationId: createDependant
      summary: Add a dependant
      description: Creates a child login with kid mode and a linked NGN account (FAM-1).
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDependantRequest'
      responses:
        '201':
          description: The dependant, with a one-time setup code for their device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependantCreated'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/family/dependants/{dependant_id}:
    get:
      tags: [family]
      operationId: getDependant
      summary: Get a dependant
      parameters:
        - $ref: '#/components/parameters/DependantId'
      responses:
        '200':
          description: The dependant and their controls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependant'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [family]
      operationId: updateDependantControls
      summary: Change a dependant's controls
      description: Spend limits, the approval threshold and pause (FAM-2).
      parameters:
        - $ref: '#/components/parameters/DependantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDependantRequest'
      responses:
        '200':
          description: The updated dependant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependant'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/family/dependants/{dependant_id}/allowance:
    put:
      tags: [family]
      operationId: setAllowance
      summary: Set an allowance
      description: A recurring transfer from the parent to the dependant.
      parameters:
        - $ref: '#/components/parameters/DependantId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Allowance'
      responses:
        '200':
          description: The dependant with the allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependant'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [family]
      operationId: stopAllowance
      summary: Stop an allowance
      parameters:
        - $ref: '#/components/parameters/DependantId'
      responses:
        '204':
          description: Stopped.
  /v1/family/dependants/{dependant_id}/activity:
    get:
      tags: [family]
      operationId: listDependantActivity
      summary: A dependant's transactions
      description: Read-only view for the parent (FAM-3).
      parameters:
        - $ref: '#/components/parameters/DependantId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/family/approvals:
    get:
      tags: [family]
      operationId: listFamilyApprovals
      summary: Transfers waiting for my approval
      description: Parents see their dependants' requests; dependants see their own.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
      responses:
        '200':
          description: Pending first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyApprovalList'
  /v1/family/approvals/{approval_id}/approve:
    post:
      tags: [family]
      operationId: approveFamilyTransfer
      summary: Approve a dependant's transfer
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      responses:
        '200':
          description: Approved; the transfer goes out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyApproval'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/family/approvals/{approval_id}/decline:
    post:
      tags: [family]
      operationId: declineFamilyTransfer
      summary: Decline a dependant's transfer
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: Declined; the hold is released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyApproval'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- assistant
  /v1/assistant/conversations:
    post:
      tags: [assistant]
      operationId: startAssistantConversation
      summary: Start an assistant chat
      responses:
        '201':
          description: An empty conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConversation'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/assistant/conversations/{conversation_id}/messages:
    get:
      tags: [assistant]
      operationId: listAssistantMessages
      summary: Assistant chat history
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantMessagePage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [assistant]
      operationId: sendAssistantMessage
      summary: Ask the assistant
      description: |
        The LLM only sees redacted or aggregated data and calls typed server tools (AI-6, AI-9).
        Money actions come back as `prepared_action` blocks; nothing moves until the customer
        confirms one. 503 `assistant_unavailable` means show the non-AI shortcuts instead.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantPrompt'
      responses:
        '201':
          description: The assistant's reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantMessage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/assistant/actions/{action_id}/confirm:
    post:
      tags: [assistant]
      operationId: confirmAssistantAction
      summary: Confirm a prepared action
      description: The customer reviews the card, then confirms with PIN or biometrics. Runs through the normal endpoint rules (limits, risk, fees).
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      responses:
        '200':
          description: The action ran.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedAction'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/assistant/actions/{action_id}/discard:
    post:
      tags: [assistant]
      operationId: discardAssistantAction
      summary: Discard a prepared action
      parameters:
        - $ref: '#/components/parameters/ActionId'
      responses:
        '200':
          description: Discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedAction'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- settings and privacy
  /v1/users/me/preferences:
    get:
      tags: [users]
      operationId: getPreferences
      summary: Get app preferences
      description: Appearance, language, low-data mode, auto-lock and AI toggles (FR-SET, AI-8).
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
    put:
      tags: [users]
      operationId: setPreferences
      summary: Change app preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
  /v1/privacy/exports:
    post:
      tags: [users]
      operationId: requestDataExport
      summary: Export my data
      description: A JSON archive of my data, emailed when ready (SET-5, NDPA 2023).
      responses:
        '202':
          description: The export is being prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/privacy/deletion:
    post:
      tags: [users]
      operationId: requestAccountDeletion
      summary: Request account deletion
      description: Needs a zero balance and step-up. Ledger records are kept for the retention period; profile data is erased.
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      responses:
        '202':
          description: The request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- realtime
  /v1/realtime/tickets:
    post:
      tags: [realtime]
      operationId: createRealtimeTicket
      summary: Get a WebSocket ticket
      description: |
        Connect to `wss://<host>/v1/realtime?ticket=<ticket>` within 30 seconds. Tickets are
        single-use so the access token never appears in a URL. The server sends
        `RealtimeEvent` messages; the client may send `RealtimeClientMessage`.
      responses:
        '201':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- admin: auth
  /v1/admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: staffLogin
      summary: Staff login, step 1
      description: Password first; TOTP is always required next (ADM-1). First login returns an enrolment URI.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Send the TOTP code next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/admin/auth/totp:
    post:
      tags: [admin-auth]
      operationId: staffVerifyTotp
      summary: Staff login, step 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffTotpRequest'
      responses:
        '200':
          description: A staff session (8-hour lifetime, no refresh).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: staffLogout
      summary: Staff logout
      security:
        - staffAuth: []
      responses:
        '204':
          description: The staff session was revoked.
  /v1/admin/me:
    get:
      tags: [admin-auth]
      operationId: getStaffMe
      summary: The signed-in staff member
      security:
        - staffAuth: []
      responses:
        '200':
          description: Profile and roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- admin: dashboard and customers
  /v1/admin/dashboard:
    get:
      tags: [admin]
      operationId: getAdminDashboard
      summary: Dashboard KPIs
      description: Users, volume by currency, transfers by status, fraud hold rate and FX P&L (ADM-2).
      security:
        - staffAuth: []
      x-roles: [support, compliance, finance, admin]
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: The KPIs for the period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/customers:
    get:
      tags: [admin]
      operationId: searchCustomers
      summary: Search customers
      description: By name, email, phone, @nemtag or account number. Every search is audit-logged.
      security:
        - staffAuth: []
      x-roles: [support, compliance, finance, admin]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSummaryPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/customers/{user_id}:
    get:
      tags: [admin]
      operationId: getCustomer360
      summary: Customer 360
      description: Profile, accounts, KYC, devices, recent transactions, notes and flags (ADM-3). PII is masked for the support role.
      security:
        - staffAuth: []
      x-roles: [support, compliance, finance, admin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer360'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/customers/{user_id}/notes:
    post:
      tags: [admin]
      operationId: addCustomerNote
      summary: Add a note
      security:
        - staffAuth: []
      x-roles: [support, compliance, finance, admin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffNote'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/customers/{user_id}/freeze:
    post:
      tags: [admin]
      operationId: freezeCustomer
      summary: Freeze a customer
      description: Blocks logins and outgoing money at once. Takes effect immediately; unfreezing needs a second approver.
      security:
        - staffAuth: []
      x-roles: [compliance, admin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The customer is frozen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer360'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/customers/{user_id}/unfreeze:
    post:
      tags: [admin]
      operationId: requestCustomerUnfreeze
      summary: Request an unfreeze
      description: Maker-checker (ADM-10). Creates an approval request; another staff member must approve it.
      security:
        - staffAuth: []
      x-roles: [compliance, admin]
      x-maker-checker: true
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '202':
          description: Waiting for a checker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/customers/{user_id}/limit-overrides:
    post:
      tags: [admin]
      operationId: requestLimitOverride
      summary: Request a limit override
      description: Maker-checker (ADM-10). Temporarily raises one customer's limits above their tier.
      security:
        - staffAuth: []
      x-roles: [compliance, admin]
      x-maker-checker: true
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitOverrideRequest'
      responses:
        '202':
          description: Waiting for a checker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------- admin: kyc
  /v1/admin/kyc/reviews:
    get:
      tags: [admin]
      operationId: listKycReviews
      summary: KYC review queue
      description: Oldest first, so nobody waits too long (ADM-4).
      security:
        - staffAuth: []
      x-roles: [compliance, admin]
      parameters:
