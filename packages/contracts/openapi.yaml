      operationId: demoFundWallet
      summary: Fund a demo wallet
      description: Demo users only (DEMO-1). Posts from the demo funding account through the ledger.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoFundRequest'
      responses:
        '201':
          description: The credit transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/demo/inbound-transfer:
    post:
      tags: [demo]
      operationId: demoInboundTransfer
      summary: Simulate an incoming transfer
      description: An NGN transfer from another bank or a USD/GBP/EUR payment into a wallet (FX-3). EMTL applies to NGN inflows of ₦10,000 or more.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoInboundRequest'
      responses:
        '201':
          description: The credit transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/demo/fail-next-transfer:
    post:
      tags: [demo]
      operationId: demoFailNextTransfer
      summary: Make the next bank transfer fail
      description: The next interbank transfer fails at the partner and is auto-reversed, to show TRF-7.
      responses:
        '204':
          description: Armed.
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/demo/time-travel:
    post:
      tags: [demo]
      operationId: demoTimeTravel
      summary: Move the demo clock forward
      description: Runs interest accrual, ajo cycles, schedules and loan due dates for the skipped days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoTimeTravelRequest'
      responses:
        '200':
          description: The new demo date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoClock'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/demo/reset:
    post:
      tags: [demo]
      operationId: demoReset
      summary: Reset demo data
      description: Re-seeds the persona from scratch. Other demo users are not affected.
      responses:
        '204':
          description: Reset.
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- developer platform
  /v1/developer/api-keys:
    get:
      tags: [developer]
      operationId: listApiKeys
      summary: List API keys
      description: Business customers manage their own keys in the developer portal (DEV-1).
      responses:
        '200':
          description: Keys, newest first. Secrets are never returned again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
    post:
      tags: [developer]
      operationId: createApiKey
      summary: Create an API key
      description: The secret is shown once and stored only as a hash. Sandbox keys start with `nem_test_`.
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: The key and its one-time secret.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/developer/api-keys/{key_id}:
    delete:
      tags: [developer]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Takes effect within a minute everywhere.
      parameters:
        - $ref: '#/components/parameters/KeyId'
      responses:
        '204':
          description: Revoked.
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/developer/webhooks:
    get:
      tags: [developer]
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Every endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointList'
    post:
      tags: [developer]
      operationId: createWebhookEndpoint
      summary: Add a webhook endpoint
      description: HTTPS only. The signing secret is shown once (DEV-3).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookEndpointRequest'
      responses:
        '201':
          description: The endpoint and its one-time signing secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreated'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/developer/webhooks/{endpoint_id}:
    get:
      tags: [developer]
      operationId: getWebhookEndpoint
      summary: Get a webhook endpoint
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [developer]
      operationId: updateWebhookEndpoint
      summary: Change a webhook endpoint
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookEndpointRequest'
      responses:
        '200':
          description: The updated endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [developer]
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        '204':
          description: Deleted; pending retries are cancelled.
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/developer/webhooks/{endpoint_id}/rotate-secret:
    post:
      tags: [developer]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      description: The old secret keeps signing alongside the new one for 24 hours.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        '200':
          description: The new one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreated'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/developer/webhooks/{endpoint_id}/test:
    post:
      tags: [developer]
      operationId: sendTestWebhook
      summary: Send a test event
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        '202':
          description: The queued delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/developer/webhooks/{endpoint_id}/deliveries:
    get:
      tags: [developer]
      operationId: listWebhookDeliveries
      summary: Delivery log
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/developer/webhook-deliveries/{delivery_id}/replay:
    post:
      tags: [developer]
      operationId: replayWebhookDelivery
      summary: Replay a delivery
      description: Sends the same event again with the same `Nem-Event-Id`, so receivers can deduplicate.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '202':
          description: The new delivery attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/developer/sandbox/payments:
    post:
      tags: [developer]
      operationId: simulateSandboxPayment
      summary: Simulate a customer payment
      description: Pays one of my payment links from a sandbox payer so I can test webhooks end to end (DEV-2).
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxPaymentRequest'
      responses:
        '201':
          description: The resulting transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- partner callbacks (inbound webhooks)
  /v1/partner-webhooks/{partner}:
    post:
      tags: [partners]
      operationId: receivePartnerWebhook
      summary: Receive a partner callback
      description: |
        Status callbacks from sandbox partners (interbank rail, biller, inbound foreign currency).
        HMAC-SHA256 signed with a timestamp; deduplicated by `Partner-Event-Id`.
      security: []
      parameters:
        - name: partner
          in: path
          required: true
          schema:
            type: string
            enum: [sandbox_nip, sandbox_biller, sandbox_fx_inbound, paystack_test]
        - name: Partner-Signature
          in: header
          required: true
          description: '`t=<unix seconds>,v1=<hex HMAC-SHA256 of "t.body">`.'
          schema:
            type: string
        - name: Partner-Event-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCallback'
      responses:
        '200':
          description: Accepted (also returned for duplicates).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
