    # ------------------------------------------------------------ ajo
    AjoFrequency:
      type: string
      enum: [daily, weekly, monthly]
    AjoMember:
      type: object
      required:
        [member, position, status, has_received_payout, contributions_paid, missed_contributions]
      properties:
        member:
          $ref: '#/components/schemas/PartySummary'
        position:
          type: [integer, 'null']
          description: Payout turn; null until a random draw is made at start.
          minimum: 1
        status:
          type: string
          enum: [invited, joined, defaulted, left]
        has_received_payout:
          type: boolean
        contributions_paid:
          type: integer
          minimum: 0
        missed_contributions:
          type: integer
          minimum: 0
    AjoGroup:
      type: object
      required:
        [
          id,
          name,
          contribution,
          frequency,
          member_count,
          rotation,
          status,
          members,
          current_cycle,
          total_cycles,
          pot_balance,
          grace_period_hours,
          created_by,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        contribution:
          $ref: '#/components/schemas/Money'
        frequency:
          $ref: '#/components/schemas/AjoFrequency'
        member_count:
          type: integer
          minimum: 2
          maximum: 30
        rotation:
          type: string
          enum: [fixed, random_draw]
        status:
          type: string
          enum: [forming, active, completed, cancelled]
        members:
          type: array
          items:
            $ref: '#/components/schemas/AjoMember'
        current_cycle:
          type: integer
          minimum: 0
        total_cycles:
          type: integer
          minimum: 2
        next_contribution_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        next_payout:
          oneOf:
            - type: object
              required: [member, amount, at]
              properties:
                member:
                  $ref: '#/components/schemas/PartySummary'
                amount:
                  $ref: '#/components/schemas/Money'
                at:
                  $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        pot_balance:
          description: Held in the group's escrow ledger account; only the ledger can pay it out.
          $ref: '#/components/schemas/Money'
        grace_period_hours:
          type: integer
          minimum: 0
          maximum: 72
        invite_url:
          type: [string, 'null']
          format: uri
        created_by:
          $ref: '#/components/schemas/PartySummary'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AjoGroupList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AjoGroup'
    CreateAjoGroupRequest:
      type: object
      required:
        [name, contribution, frequency, member_count, rotation, start_date, source_account_id]
      properties:
        name:
          type: string
          maxLength: 40
        contribution:
          $ref: '#/components/schemas/Money'
        frequency:
          $ref: '#/components/schemas/AjoFrequency'
        member_count:
          type: integer
          minimum: 2
          maximum: 30
        rotation:
          type: string
          enum: [fixed, random_draw]
        start_date:
          $ref: '#/components/schemas/Date'
        grace_period_hours:
          type: integer
          minimum: 0
          maximum: 72
          default: 24
        source_account_id:
          description: The account contributions are debited from.
          $ref: '#/components/schemas/Uuid'
    AjoInviteRequest:
      type: object
      properties:
        nemtags:
          type: array
          maxItems: 29
          items:
            $ref: '#/components/schemas/Nemtag'
