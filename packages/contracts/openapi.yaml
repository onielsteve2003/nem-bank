  # ---------------------------------------------------------------- transfers
  /v1/banks:
    get:
      tags: [transfers]
      operationId: listBanks
      summary: List Nigerian banks
      description: CBN bank codes for the bank picker (TRF-2). Cache for a day.
      responses:
        '200':
          description: Banks sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankList'
  /v1/payees/resolve:
    post:
      tags: [transfers]
      operationId: resolvePayee
      summary: Look up a payee
      description: |
        Resolves a @nemtag, phone or account number to a name. For other banks it runs
        Confirmation of Payee and returns `match`, `close_match` or `no_match` (TRF-3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayeeQuery'
      responses:
        '200':
          description: The payee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPayee'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/transfers/quote:
    post:
      tags: [transfers]
      operationId: quoteTransfer
      summary: Price a transfer
      description: Fee, levy, remaining daily limit and any cooling-off, shown before the customer confirms (TRF-4, TRF-8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferQuoteRequest'
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/transfers:
    get:
      tags: [transfers]
      operationId: listTransfers
      summary: List transfers
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransferStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Transfers, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPage'
    post:
      tags: [transfers]
      operationId: createTransfer
      summary: Send money
      description: |
        Device-signed and idempotent: a double tap never double-debits (TRF-5). The risk
        engine decides the outcome (TRF-6):
        - `allow` → `completed` for Nem users, `processing` for other banks.
        - `step_up` → `pending_step_up`; finish with `POST /v1/transfers/{transfer_id}/step-up`.
        - `hold` → `held_for_review` with plain-language reasons.
        A first transfer above the cooling-off threshold to a new beneficiary becomes `delayed`
        unless a step-up token is sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/OptionalStepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: The transfer was accepted. Check `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/transfers/{transfer_id}:
    get:
      tags: [transfers]
      operationId: getTransfer
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: transfers_read
      summary: Track a transfer
      description: The status timeline (TRF-7). Live updates arrive as `transfer.updated` events.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/transfers/{transfer_id}/step-up:
    post:
      tags: [transfers]
      operationId: stepUpTransfer
      summary: Release a transfer after step-up
      description: Moves a `pending_step_up` or `delayed` transfer forward once the customer passes step-up.
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/StepUpTokenHeader'
      responses:
        '200':
          description: The transfer after step-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/transfers/{transfer_id}/cancel:
    post:
      tags: [transfers]
      operationId: cancelTransfer
      summary: Cancel a waiting transfer
      description: Only `pending_step_up`, `delayed` and `held_for_review` transfers can be cancelled; the hold is released.
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/transfers/international:
    post:
      tags: [transfers]
      operationId: createInternationalTransfer
      summary: Send money abroad
      description: |
        Fully designed but needs a licensed remittance partner (TRF-14). Returns 403
        `paid_feature_required` until the `international_transfers` flag is enabled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternationalTransferRequest'
      responses:
        '201':
          description: The transfer was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '403':
          $ref: '#/components/responses/PaidFeatureRequired'
  /v1/scheduled-transfers:
    get:
      tags: [transfers]
      operationId: listScheduledTransfers
      summary: List scheduled transfers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Schedules, next run first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTransferPage'
    post:
      tags: [transfers]
      operationId: createScheduledTransfer
      summary: Schedule a transfer
      description: One-off or recurring (daily, weekly, monthly). Signed, because it authorises future debits (TRF-9).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledTransferRequest'
      responses:
        '201':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTransfer'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/scheduled-transfers/{schedule_id}:
    get:
      tags: [transfers]
      operationId: getScheduledTransfer
      summary: Get a scheduled transfer
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTransfer'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [transfers]
      operationId: updateScheduledTransfer
      summary: Pause, resume or edit a schedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduledTransferRequest'
      responses:
        '200':
          description: The updated schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTransfer'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [transfers]
      operationId: cancelScheduledTransfer
      summary: Cancel a schedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '204':
          description: No future runs will happen.
        '404':
          $ref: '#/components/responses/NotFound'

