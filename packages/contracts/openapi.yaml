openapi: 3.1.0
info:
  title: Nem Bank API
  version: 1.0.0
  summary: The single source of truth for the Nem Bank HTTP API.
  description: |
    Contract-first: TypeScript types (`openapi-typescript`) and the Go server
    (`oapi-codegen`, Gin strict server) are generated from this file.

    Conventions used by every endpoint:
    - **Money** is `{ "amount_minor": "150000", "currency": "NGN" }`. Minor units are a
      string so JavaScript never loses precision.
    - **Errors** are RFC 9457 `application/problem+json` with a stable `code`.
    - **Lists** use opaque cursors (`cursor`, `limit`, `next_cursor`) and return
      `{ "data": [...], "page": { "next_cursor": ... } }`.
    - **IDs** are UUIDv7; **timestamps** are RFC 3339 in UTC; **dates** are `YYYY-MM-DD`
      in Africa/Lagos.
    - **Money-moving POSTs** require `Idempotency-Key` and a device signature
      (`X-Device-Id`, `X-Device-Signature`, `X-Signature-Timestamp`, `X-Nonce`).
      The signature covers the canonical payload
      `METHOD\npath\ntimestamp\nnonce\nsha256(body)`.
    - **Step-up** actions also require `X-Step-Up-Token`, issued by `POST /v1/auth/step-up/{step_up_id}/verify`.
    - Every response carries `X-Request-Id`; problems repeat it as `request_id`.

    All money is simulated. External rails run in sandbox mode.
  contact:
    name: Nem Bank
    url: https://github.com/onielsteve2003/nem-bank
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
    description: Health and service metadata.
  - name: auth
    description: Sign up, login, tokens, password reset and step-up verification (FR-AUTH).
  - name: users
    description: The signed-in customer's profile, @nemtag and transaction PIN.
  - name: devices
    description: Device binding with Ed25519 keys and the new-device cool-off (AUTH-6, AUTH-8).
  - name: accounts
    description: NGN account and USD, GBP, EUR wallets with available vs ledger balances (FR-ACC).
  - name: transactions
    description: Transaction history, detail, categories and receipts (ACC-5 to ACC-7).
  - name: statements
    description: Official PDF statements with a public verification page (ACC-8).
  - name: transfers
    description: Payee lookup, Confirmation of Payee, quotes, transfers and schedules (FR-TRF).
  - name: beneficiaries
    description: Saved recipients with new-beneficiary cooling-off (TRF-8).
  - name: money-requests
    description: Requests between Nem users and split bills (TRF-10, TRF-11).
  - name: payment-links
    description: Shareable payment links and the public pay page (TRF-12).
  - name: qr
    description: Server-signed QR payloads to receive and pay (TRF-13).
security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health
      description: Liveness check. Also used by the uptime monitor to keep the API warm.
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- auth
  /v1/auth/signup:
    post:
      tags: [auth]
      operationId: startSignup
      summary: Start sign-up
      description: Validates the customer's details (18+, +234 phone, consent) and emails a 6-digit OTP (AUTH-1, AUTH-2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Sign-up started; an OTP was emailed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/signup/complete:
    post:
      tags: [auth]
      operationId: completeSignup
      summary: Finish sign-up
      description: Sets the password and binds the first device. Returns a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompleteRequest'
      responses:
        '201':
          description: The account was created and the device bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Verify an email OTP
      description: Codes expire after 10 minutes and allow 5 attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: The code is correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/otp/resend:
    post:
      tags: [auth]
      operationId: resendOtp
      summary: Resend an email OTP
      description: Allowed once the 60-second cooldown in `resend_available_at` has passed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '200':
          description: A new code was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with a password
      description: |
        Email or phone plus password (AUTH-7). Logging in from an unknown device binds it and
        starts the 24-hour new-device cool-off (AUTH-8): `device.cool_off_until` is set and
        the customer's other devices are alerted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/device-challenge:
    post:
      tags: [auth]
      operationId: createDeviceChallenge
      summary: Get a device-login challenge
      description: First step of biometric quick login on a trusted device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceChallengeRequest'
      responses:
        '201':
          description: Sign `nonce` with the device key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceChallenge'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/login/device:
    post:
      tags: [auth]
      operationId: loginWithDevice
      summary: Quick login with the device key
      description: The app unlocks the device key with Face ID or fingerprint and signs the challenge (AUTH-5, AUTH-7).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/demo:
    post:
      tags: [auth]
      operationId: startDemoSession
      summary: Start a demo session
      description: One tap into a seeded persona with 6 months of history (AUTH-11). Demo users are isolated and reset nightly.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionRequest'
      responses:
        '201':
          description: A demo session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate tokens
      description: Refresh tokens rotate on every use. Reusing an old one revokes the whole token family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: The session (or every session) was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Start a password reset
      description: Always returns 202 so the response never reveals whether the email exists (AUTH-9).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: If the email is registered, a code was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Reset the password
      description: Revokes every session and starts the new-device cool-off on all devices.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/auth/step-up:
    post:
      tags: [auth]
      operationId: startStepUp
      summary: Start step-up verification
      description: Asks for extra proof before a sensitive action (risky transfer, unfreeze, PIN reset, card reveal).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpStartRequest'
      responses:
        '201':
          description: The checks the customer must pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/step-up/{step_up_id}/verify:
    post:
      tags: [auth]
      operationId: verifyStepUp
      summary: Complete step-up verification
      parameters:
        - $ref: '#/components/parameters/StepUpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpVerifyRequest'
      responses:
        '200':
          description: Pass `step_up_token` as `X-Step-Up-Token` on the protected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpToken'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- users
  /v1/users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Get my profile
      responses:
        '200':
          description: The signed-in customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      operationId: updateMe
      summary: Update my profile
      description: Legal names change only through KYC; this edits display fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/users/nemtags/{nemtag}/availability:
    get:
      tags: [users]
      operationId: checkNemtag
      summary: Check whether a @nemtag is free
      parameters:
        - name: nemtag
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Nemtag'
      responses:
        '200':
          description: Availability, with suggestions when taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemtagAvailability'
  /v1/users/me/nemtag:
    put:
      tags: [users]
      operationId: setNemtag
      summary: Claim my @nemtag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNemtagRequest'
      responses:
        '200':
          description: The tag is now mine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/users/me/pin:
    put:
      tags: [users]
      operationId: setPin
      summary: Set my transaction PIN
      description: First-time setup only. Weak PINs (1234, 0000, repeated digits, date-of-birth digits) return 422 `weak_pin` (AUTH-4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
      responses:
        '204':
          description: The PIN was set.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/users/me/pin/verify:
    post:
      tags: [users]
      operationId: verifyPin
      summary: Check my transaction PIN
      description: Five wrong tries lock the PIN with escalating backoff (AUTH-4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPinRequest'
      responses:
        '200':
          description: The result and the attempts left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinVerification'
        '423':
          $ref: '#/components/responses/Locked'
  /v1/users/me/pin/reset:
    post:
      tags: [users]
      operationId: resetPin
      summary: Reset my transaction PIN
      description: Needs step-up verification (AUTH-9).
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
      responses:
        '204':
          description: The PIN was replaced.
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------- devices
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List my bound devices
      responses:
        '200':
          description: Every device bound to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
    post:
      tags: [devices]
      operationId: bindDevice
      summary: Bind a new device key
      description: Registers a new Ed25519 public key. Needs step-up and starts the 24-hour cool-off on the new device.
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: The device is bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/devices/{device_id}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device
      description: Removes the device key and ends its sessions (SEC-2).
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '204':
          description: The device was revoked.
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- accounts
  /v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List my accounts
      description: The NGN account plus any open foreign-currency wallets.
      responses:
        '200':
          description: All accounts, NGN first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
    post:
      tags: [accounts]
      operationId: openAccount
      summary: Open a foreign-currency wallet
      description: USD, GBP and EUR wallets need KYC Tier 2+ (KYC-7); lower tiers get 403 `kyc_tier_required`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: The wallet was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/accounts/{account_id}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Get an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account with balances and receiving details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/accounts/{account_id}/holds:
    get:
      tags: [accounts]
      operationId: listAccountHolds
      summary: List active holds
      description: Card authorizations and pending transfers that make up `ledger_balance − available_balance` (ACC-3).
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Active holds, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldList'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- transactions
  /v1/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      summary: List transactions
      description: Newest first, filterable and searchable (ACC-5).
      parameters:
        - name: account_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: type
          in: query
          description: One or more types, comma-separated.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TransactionType'
        - name: currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: q
          in: query
          description: Free-text search over counterparty, narration and reference.
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/transactions/{transaction_id}:
    get:
      tags: [transactions]
      operationId: getTransaction
      summary: Get a transaction
      description: Detail with status timeline, fees and what the customer can do next (ACC-6).
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [transactions]
      operationId: updateTransaction
      summary: Recategorise a transaction
      description: The correction also trains smart categories for this customer (AI-3).
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: The updated transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/transactions/{transaction_id}/receipt:
    get:
      tags: [transactions]
      operationId: getReceipt
      summary: Get a receipt
      description: JSON for the in-app receipt, or a PDF with `Accept application/pdf` (ACC-7).
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- statements
  /v1/statements:
    get:
      tags: [statements]
      operationId: listStatements
      summary: List my statements
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Statements, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementPage'
    post:
      tags: [statements]
      operationId: requestStatement
      summary: Request an official statement
      description: Generated in the background; poll or wait for the `statement.ready` event (ACC-8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementRequest'
      responses:
        '202':
          description: Generation has started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/statements/{statement_id}:
    get:
      tags: [statements]
      operationId: getStatement
      summary: Get a statement
      parameters:
        - $ref: '#/components/parameters/StatementId'
      responses:
        '200':
          description: The statement and its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/statements/{statement_id}/download:
    get:
      tags: [statements]
      operationId: downloadStatement
      summary: Download a statement PDF
      parameters:
        - $ref: '#/components/parameters/StatementId'
      responses:
        '200':
          description: The PDF, with the verification hash and QR on every page.
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/public/statements/{verification_code}:
    get:
      tags: [statements]
      operationId: verifyStatement
      summary: Verify a statement (public)
      description: The page the statement QR links to. Shows only masked details so the link is safe to share with an embassy.
      security: []
      parameters:
        - name: verification_code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9]{12}$'
      responses:
        '200':
          description: The statement is genuine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementVerification'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- transfers
  /v1/banks:
    get:
      tags: [transfers]
      operationId: listBanks
      summary: List Nigerian banks
      description: CBN bank codes for the bank picker (TRF-2). Cache for a day.
      responses:
        '200':
          description: Banks sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankList'
  /v1/payees/resolve:
    post:
      tags: [transfers]
      operationId: resolvePayee
      summary: Look up a payee
      description: |
        Resolves a @nemtag, phone or account number to a name. For other banks it runs
        Confirmation of Payee and returns `match`, `close_match` or `no_match` (TRF-3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayeeQuery'
      responses:
        '200':
          description: The payee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPayee'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/transfers/quote:
    post:
      tags: [transfers]
      operationId: quoteTransfer
      summary: Price a transfer
      description: Fee, levy, remaining daily limit and any cooling-off, shown before the customer confirms (TRF-4, TRF-8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferQuoteRequest'
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/transfers:
    get:
      tags: [transfers]
      operationId: listTransfers
      summary: List transfers
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransferStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Transfers, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPage'
    post:
      tags: [transfers]
      operationId: createTransfer
      summary: Send money
      description: |
        Device-signed and idempotent: a double tap never double-debits (TRF-5). The risk
        engine decides the outcome (TRF-6):
        - `allow` → `completed` for Nem users, `processing` for other banks.
        - `step_up` → `pending_step_up`; finish with `POST /v1/transfers/{transfer_id}/step-up`.
        - `hold` → `held_for_review` with plain-language reasons.
        A first transfer above the cooling-off threshold to a new beneficiary becomes `delayed`
        unless a step-up token is sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/OptionalStepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: The transfer was accepted. Check `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/transfers/{transfer_id}:
    get:
      tags: [transfers]
      operationId: getTransfer
      summary: Track a transfer
      description: The status timeline (TRF-7). Live updates arrive as `transfer.updated` events.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/transfers/{transfer_id}/step-up:
    post:
      tags: [transfers]
      operationId: stepUpTransfer
      summary: Release a transfer after step-up
      description: Moves a `pending_step_up` or `delayed` transfer forward once the customer passes step-up.
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/StepUpTokenHeader'
      responses:
        '200':
          description: The transfer after step-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/transfers/{transfer_id}/cancel:
    post:
      tags: [transfers]
      operationId: cancelTransfer
      summary: Cancel a waiting transfer
      description: Only `pending_step_up`, `delayed` and `held_for_review` transfers can be cancelled; the hold is released.
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/transfers/international:
    post:
      tags: [transfers]
      operationId: createInternationalTransfer
      summary: Send money abroad
      description: |
        Fully designed but needs a licensed remittance partner (TRF-14). Returns 403
        `paid_feature_required` until the `international_transfers` flag is enabled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceSignature'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/Nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternationalTransferRequest'
      responses:
        '201':
          description: The transfer was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '403':
          $ref: '#/components/responses/PaidFeatureRequired'
  /v1/scheduled-transfers:
    get:
      tags: [transfers]
      operationId: listScheduledTransfers
      summary: List scheduled transfers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Schedules, next run first.
          content:
