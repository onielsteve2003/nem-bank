  /v1/security/checkup:
    get:
      tags: [security]
      operationId: getSecurityCheckup
      summary: Security checkup
      responses:
        '200':
          description: A score with actionable items (SEC-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCheckup'
  /v1/security/sessions:
    get:
      tags: [security]
      operationId: listSessions
      summary: List active sessions
      responses:
        '200':
          description: Sessions across my devices (SEC-2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
  /v1/security/sessions/{session_id}:
    delete:
      tags: [security]
      operationId: revokeSession
      summary: End a session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: The session's refresh token was revoked.
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/security/limits:
    get:
      tags: [security]
      operationId: getSelfLimits
      summary: Get my own limits
      responses:
        '200':
          description: Self-set limits below the KYC cap (SEC-3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfLimits'
    put:
      tags: [security]
      operationId: setSelfLimits
      summary: Change my own limits
      description: Lowering applies at once. Raising needs step-up and takes effect after 24 hours.
      parameters:
        - $ref: '#/components/parameters/OptionalStepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSelfLimitsRequest'
      responses:
        '200':
          description: The limits, with any pending increase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfLimits'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/security/panic:
    get:
      tags: [security]
      operationId: getPanicState
      summary: Get panic mode
      responses:
        '200':
          description: Whether panic mode is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicState'
    post:
      tags: [security]
      operationId: activatePanic
      summary: Press the panic button
      description: Freezes every card and blocks outgoing money in one call (SEC-4). Needs no step-up, on purpose.
      responses:
        '200':
          description: Panic mode is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicState'
    delete:
      tags: [security]
      operationId: releasePanic
      summary: Turn panic mode off
      description: Unblocks outgoing money. Cards stay frozen until each is unfrozen.
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      responses:
        '200':
          description: Panic mode is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicState'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/security/duress-pin:
    put:
      tags: [security]
      operationId: setDuressPin
      summary: Set a duress PIN
      description: |
        Entering it instead of the real PIN shows a decoy low-balance view, silently blocks
        transfers and raises a silent alert (SEC-5). The response never reveals which PIN was used.
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
      responses:
        '204':
          description: Saved.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [security]
      operationId: removeDuressPin
      summary: Remove the duress PIN
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      responses:
        '204':
          description: Removed.
  /v1/security/question:
    put:
      tags: [security]
      operationId: setSecurityQuestion
      summary: Set my security question
      description: Used as a step-up method. The answer is normalised and stored as an Argon2id hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityQuestionRequest'
      responses:
        '204':
          description: Saved.
  /v1/security/scam-check:
    post:
      tags: [security]
      operationId: checkScam
      summary: Check a message, link or account
      description: Classifier plus Nigerian scam rules; returns a verdict and reasons (SEC-6, AI-2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScamCheckRequest'
      responses:
        '200':
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScamCheckResult'
        '429':
          $ref: '#/components/responses/TooManyRequests'
