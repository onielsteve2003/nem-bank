      type: object
      required: [active, activated_at, cards_frozen, outgoing_blocked]
      properties:
        active:
          type: boolean
        activated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cards_frozen:
          type: integer
          minimum: 0
        outgoing_blocked:
          type: boolean
    SecurityQuestionRequest:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
          maxLength: 120
        answer:
          type: string
          writeOnly: true
          minLength: 3
          maxLength: 100
    ScamCheckRequest:
      type: object
      required: [kind, content]
      description: Content is checked and discarded; it is never stored or sent to an LLM.
      properties:
        kind:
          type: string
          enum: [message, link, account_number]
        content:
          type: string
          maxLength: 2000
    ScamCheckResult:
      type: object
      required: [verdict, score, reasons, advice, ai]
      properties:
        verdict:
          type: string
          enum: [looks_safe, suspicious, likely_scam]
        score:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RiskReason'
        advice:
          type: string
        reported_account:
          type: [boolean, 'null']
          description: For account numbers, whether other customers have reported it.
        ai:
          $ref: '#/components/schemas/AiMeta'
    AlertPreferences:
      type: object
      required: [login_alerts, new_device_alerts, transaction_alert_threshold]
      properties:
        login_alerts:
          type: boolean
        new_device_alerts:
          type: boolean
          description: Always on during a new-device cool-off.
        transaction_alert_threshold:
          description: Alert on debits at or above this amount; zero alerts on every debit.
          $ref: '#/components/schemas/Money'

    # ------------------------------------------------------------ kyc
    TierInfo:
      type: object
      required: [tier, daily_limit, max_balance, requirements, current]
      properties:
        tier:
          $ref: '#/components/schemas/KycTier'
        daily_limit:
          $ref: '#/components/schemas/Money'
        max_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        requirements:
          type: array
          items:
            type: string
        unlocks:
          type: array
          items:
            type: string
            enum: [fx_wallets, usd_cards, credit, higher_limits]
        current:
          type: boolean
    KycOverview:
      type: object
      required: [tier, status, tiers, latest_submission, demo_limits]
      properties:
        tier:
          $ref: '#/components/schemas/KycTier'
        status:
          $ref: '#/components/schemas/KycStatus'
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/TierInfo'
        latest_submission:
          oneOf:
            - $ref: '#/components/schemas/KycSubmission'
            - type: 'null'
        demo_limits:
          type: boolean
          description: Limits are configurable demo values based on CBN guidance.
    IdentityNumberRequest:
      type: object
      required: [type, number]
      properties:
        type:
          type: string
          enum: [bvn, nin]
        number:
          type: string
          pattern: '^[0-9]{11}$'
          writeOnly: true
    IdentityVerification:
      type: object
      required: [type, verified, name_match, sandbox, tier]
      properties:
        type:
          type: string
          enum: [bvn, nin]
        verified:
          type: boolean
        name_match:
          $ref: '#/components/schemas/NameMatch'
        sandbox:
          type: boolean
          description: True while only sandbox test numbers are accepted.
        tier:
          $ref: '#/components/schemas/KycTier'
    KycDocumentKind:
      type: string
      enum: [id_front, id_back, selfie, proof_of_address]
    KycDocumentUpload:
      type: object
      required: [kind, file]
      properties:
        kind:
          $ref: '#/components/schemas/KycDocumentKind'
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG or PDF, at most 5 MB.
    KycDocument:
      type: object
      required: [id, kind, status, uploaded_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/KycDocumentKind'
        status:
          type: string
          enum: [uploaded, accepted, rejected]
        quality_issues:
          type: array
          items:
            type: string
            enum: [blurry, glare, cropped, face_not_found]
        uploaded_at:
          $ref: '#/components/schemas/Timestamp'
    IdPrefillRequest:
      type: object
      required: [document_id, consent]
      properties:
        document_id:
          $ref: '#/components/schemas/Uuid'
        consent:
          type: boolean
          const: true
    IdPrefill:
      type: object
      required: [fields, ai]
      properties:
        fields:
          type: object
          properties:
            id_type:
              type: [string, 'null']
              enum: [national_id, drivers_licence, international_passport, voters_card, null]
            id_number:
              type: [string, 'null']
            full_name:
              type: [string, 'null']
            date_of_birth:
              oneOf:
                - $ref: '#/components/schemas/Date'
                - type: 'null'
            expiry_date:
              oneOf:
                - $ref: '#/components/schemas/Date'
                - type: 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        ai:
          $ref: '#/components/schemas/AiMeta'
    Address:
      type: object
      required: [line1, city, state, country]
      properties:
        line1:
          type: string
          maxLength: 100
        line2:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 60
        state:
          type: string
          maxLength: 60
        postal_code:
          type: string
          maxLength: 12
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          default: NG
    KycSubmissionRequest:
      type: object
      required: [target_tier, id_type, id_number, document_ids, address]
      properties:
        target_tier:
          type: integer
          const: 3
        id_type:
          type: string
          enum: [national_id, drivers_licence, international_passport, voters_card]
        id_number:
          type: string
          writeOnly: true
          maxLength: 20
        id_expiry_date:
          $ref: '#/components/schemas/Date'
        document_ids:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Uuid'
        address:
          $ref: '#/components/schemas/Address'
    KycSubmission:
      type: object
      required: [id, target_tier, status, submitted_at, reviewed_at, rejection_reason]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        target_tier:
          $ref: '#/components/schemas/KycTier'
        status:
          type: string
          enum: [pending_review, approved, rejected, resubmit]
        submitted_at:
          $ref: '#/components/schemas/Timestamp'
        reviewed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        rejection_reason:
          type: [string, 'null']
        resubmit_documents:
          type: array
          items:
            $ref: '#/components/schemas/KycDocumentKind'

    # ------------------------------------------------------------ disputes
    DisputeReason:
      type: string
      enum:
        [
          not_received,
          wrong_amount,
          duplicate_charge,
          unauthorised,
          goods_not_received,
          failed_but_debited,
          other,
        ]
    DisputeStatus:
      type: string
      enum:
        [
          submitted,
          under_review,
          awaiting_customer,
          resolved_refunded,
          resolved_declined,
          withdrawn,
        ]
    Dispute:
      type: object
      required:
        [
          id,
          case_number,
          transaction_id,
          reason,
          description,
          status,
          timeline,
          evidence,
          refund,
          created_at,
          resolved_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        case_number:
          type: string
          pattern: '^DSP-[0-9]{8}$'
        transaction_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          $ref: '#/components/schemas/DisputeReason'
        description:
          type: string
        status:
          $ref: '#/components/schemas/DisputeStatus'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        refund:
          description: Posted through the ledger when resolved in the customer's favour.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        resolution_note:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        resolved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    DisputePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dispute'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateDisputeRequest:
      type: object
      required: [transaction_id, reason, description]
      properties:
        transaction_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          $ref: '#/components/schemas/DisputeReason'
        description:
          type: string
          minLength: 10
          maxLength: 1000
        attachment_ids:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Uuid'

    # ------------------------------------------------------------ support
    SupportConversation:
      type: object
      required: [id, subject, status, assigned_agent, unread_count, last_message_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subject:
          type: string
        status:
          type: string
          enum: [open, waiting_on_customer, resolved]
        assigned_agent:
          type: [string, 'null']
          description: Agent's first name only.
        unread_count:
          type: integer
          minimum: 0
        last_message_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    SupportConversationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SupportConversation'
    StartConversationRequest:
      type: object
      required: [subject, message]
      properties:
        subject:
          type: string
          maxLength: 80
        message:
          type: string
          maxLength: 2000
        transaction_id:
          $ref: '#/components/schemas/Uuid'
    SupportMessage:
      type: object
      required: [id, conversation_id, sender, body, attachments, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        conversation_id:
          $ref: '#/components/schemas/Uuid'
        sender:
          type: string
          enum: [customer, agent, system]
        sender_name:
          type: [string, 'null']
        body:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        read_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    SupportMessagePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SupportMessage'
        page:
          $ref: '#/components/schemas/PageInfo'
    SendSupportMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        attachment_ids:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Uuid'
    HelpArticle:
      type: object
      required: [slug, title, category, body_markdown, updated_at]
      properties:
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        body_markdown:
          type: string
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    HelpArticleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [slug, title, category, excerpt]
            properties:
              slug:
                type: string
              title:
                type: string
              category:
                type: string
              excerpt:
                type: string

    # ------------------------------------------------------------ notifications
    NotificationCategory:
      type: string
      enum: [transactions, security, savings, ajo, credit, support, product, marketing]
    Notification:
      type: object
      required: [id, category, title, body, read, created_at, deep_link]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/NotificationCategory'
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        deep_link:
          type: [string, 'null']
          description: In-app route, e.g. `/transfers/0192...`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
    NotificationPage:
      type: object
      required: [data, page, unread_count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          $ref: '#/components/schemas/PageInfo'
        unread_count:
          type: integer
          minimum: 0
    MarkReadRequest:
      type: object
      description: Send `ids`, or `all` to mark everything read.
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Uuid'
        all:
          type: boolean
    ChannelPreferences:
      type: object
      required: [in_app, push, email]
      properties:
        in_app:
          type: boolean
        push:
          type: boolean
        email:
          type: boolean
    NotificationPreferences:
      type: object
      required: [categories]
      properties:
        categories:
          type: object
          description: Marketing is off by default (NOT-2).
          required: [transactions, security, savings, ajo, credit, support, product, marketing]
          properties:
            transactions:
              $ref: '#/components/schemas/ChannelPreferences'
            security:
              $ref: '#/components/schemas/ChannelPreferences'
            savings:
              $ref: '#/components/schemas/ChannelPreferences'
            ajo:
              $ref: '#/components/schemas/ChannelPreferences'
            credit:
              $ref: '#/components/schemas/ChannelPreferences'
            support:
              $ref: '#/components/schemas/ChannelPreferences'
            product:
              $ref: '#/components/schemas/ChannelPreferences'
            marketing:
              $ref: '#/components/schemas/ChannelPreferences'
    PushTokenRequest:
      type: object
      required: [device_id, expo_push_token]
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
        expo_push_token:
          type: string
          pattern: '^Expo(nent)?PushToken\[.+\]$'

    # ------------------------------------------------------------ family
    DependantControls:
      type: object
      required: [daily_spend_limit, approval_threshold, can_send_to_banks, paused]
      properties:
        daily_spend_limit:
          $ref: '#/components/schemas/Money'
        approval_threshold:
          description: Transfers above this need the parent's approval (FAM-2).
          $ref: '#/components/schemas/Money'
        can_send_to_banks:
          type: boolean
        paused:
          type: boolean
    Allowance:
      type: object
      required: [amount, frequency, source_account_id]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        frequency:
          type: string
          enum: [weekly, monthly]
        day:
          type: integer
          description: Weekday 1–7 (Monday = 1) or day of month 1–28.
          minimum: 1
          maximum: 28
        source_account_id:
          $ref: '#/components/schemas/Uuid'
        next_run_at:
          readOnly: true
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Dependant:
      type: object
      required:
        [id, profile, date_of_birth, account_id, balance, kid_mode, controls, allowance, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        profile:
          $ref: '#/components/schemas/PartySummary'
        date_of_birth:
          $ref: '#/components/schemas/Date'
        account_id:
          $ref: '#/components/schemas/Uuid'
        balance:
          $ref: '#/components/schemas/Money'
        kid_mode:
          type: boolean
        controls:
          $ref: '#/components/schemas/DependantControls'
        allowance:
          oneOf:
            - $ref: '#/components/schemas/Allowance'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    DependantList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Dependant'
    CreateDependantRequest:
      type: object
      required: [first_name, last_name, date_of_birth, nemtag, controls]
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        date_of_birth:
          $ref: '#/components/schemas/Date'
        nemtag:
          $ref: '#/components/schemas/Nemtag'
        controls:
          $ref: '#/components/schemas/DependantControls'
    DependantCreated:
      type: object
      required: [dependant, setup_code, setup_code_expires_at]
      properties:
        dependant:
          $ref: '#/components/schemas/Dependant'
        setup_code:
          type: string
          description: Entered on the child's device to bind it. Shown once.
          pattern: '^[0-9]{8}$'
        setup_code_expires_at:
          $ref: '#/components/schemas/Timestamp'
    UpdateDependantRequest:
      type: object
      minProperties: 1
      properties:
        kid_mode:
          type: boolean
        controls:
          $ref: '#/components/schemas/DependantControls'
    ApprovalStatus:
      type: string
      enum: [pending, approved, declined, expired]
    FamilyApproval:
      type: object
      required: [id, dependant, recipient, amount, narration, status, created_at, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        dependant:
          $ref: '#/components/schemas/PartySummary'
        recipient:
          $ref: '#/components/schemas/TransferParty'
        amount:
          $ref: '#/components/schemas/Money'
        narration:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        transfer_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    FamilyApprovalList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FamilyApproval'

    # ------------------------------------------------------------ assistant
    AssistantConversation:
      type: object
      required: [id, created_at, ai]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        ai:
          $ref: '#/components/schemas/AiMeta'
    AssistantPrompt:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        language:
          type: string
          enum: [en, pcm]
    PreparedActionKind:
      type: string
      enum: [transfer, bill_payment, savings_deposit, card_freeze, fx_conversion]
    PreparedAction:
      type: object
      required: [id, kind, summary, details, status, expires_at, result]
      description: A money action the assistant drafted. It runs only when the customer confirms it.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/PreparedActionKind'
        summary:
          type: string
          examples: ['Send ₦5,000 to Mum (@ada_o) for food']
        details:
          description: The exact request body that confirming will send; its shape follows `kind`.
          anyOf:
            - $ref: '#/components/schemas/CreateTransferRequest'
            - $ref: '#/components/schemas/PayBillRequest'
            - $ref: '#/components/schemas/SavingsMovementRequest'
            - $ref: '#/components/schemas/FxConversionRequest'
            - type: object
              required: [card_id]
              properties:
                card_id:
                  $ref: '#/components/schemas/Uuid'
        quote:
          oneOf:
            - $ref: '#/components/schemas/TransferQuote'
            - type: 'null'
        status:
          type: string
          enum: [prepared, confirmed, discarded, expired, failed]
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        result:
          description: What happened after confirming.
          oneOf:
            - type: object
              required: [resource, id]
              properties:
                resource:
                  type: string
                  enum: [transfer, bill_payment, savings_goal, card, fx_conversion]
                id:
                  $ref: '#/components/schemas/Uuid'
            - type: 'null'
    AssistantTextBlock:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
    AssistantChartBlock:
      type: object
      required: [type, chart, title, series]
      properties:
        type:
          type: string
          const: chart
        chart:
          type: string
          enum: [bar, line, donut]
        title:
          type: string
        series:
          type: array
          items:
            type: object
            required: [label, amount]
            properties:
              label:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
    AssistantActionBlock:
      type: object
      required: [type, action]
      properties:
        type:
          type: string
          const: prepared_action
        action:
          $ref: '#/components/schemas/PreparedAction'
    AssistantTransactionsBlock:
      type: object
      required: [type, transactions]
      properties:
        type:
          type: string
          const: transactions
        transactions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Transaction'
    AssistantBlock:
      oneOf:
        - $ref: '#/components/schemas/AssistantTextBlock'
        - $ref: '#/components/schemas/AssistantChartBlock'
        - $ref: '#/components/schemas/AssistantActionBlock'
        - $ref: '#/components/schemas/AssistantTransactionsBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/AssistantTextBlock'
          chart: '#/components/schemas/AssistantChartBlock'
          prepared_action: '#/components/schemas/AssistantActionBlock'
          transactions: '#/components/schemas/AssistantTransactionsBlock'
    AssistantMessage:
      type: object
      required: [id, role, blocks, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        role:
          type: string
          enum: [user, assistant]
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/AssistantBlock'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        ai:
          oneOf:
            - $ref: '#/components/schemas/AiMeta'
            - type: 'null'
    AssistantMessagePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AssistantMessage'
        page:
          $ref: '#/components/schemas/PageInfo'

    # ------------------------------------------------------------ settings and privacy
    Preferences:
      type: object
      required: [appearance, language, low_data_mode, auto_lock_seconds, hide_balances, ai]
      properties:
        appearance:
          type: string
          enum: [system, dark, light]
        language:
          type: string
          description: English or Nigerian Pidgin (SET-2).
          enum: [en, pcm]
        low_data_mode:
          type: boolean
        auto_lock_seconds:
          type: integer
          enum: [30, 60, 120, 300]
        hide_balances:
          type: boolean
        ai:
          type: object
          description: Every AI feature can be switched off; the non-AI fallback takes over.
          required: [smart_categories, forecast, scam_checker, assistant, id_prefill]
          properties:
            smart_categories:
              type: boolean
            forecast:
              type: boolean
            scam_checker:
              type: boolean
            assistant:
              type: boolean
            id_prefill:
              type: boolean
    PrivacyRequest:
      type: object
      required: [id, kind, status, requested_at, completes_by]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [export, deletion]
        status:
          type: string
          enum: [received, processing, completed, rejected]
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        completes_by:
          $ref: '#/components/schemas/Timestamp'

    # ------------------------------------------------------------ realtime
    RealtimeTicket:
      type: object
      required: [ticket, url, expires_at]
      properties:
        ticket:
          type: string
        url:
          type: string
          format: uri
          examples: ['wss://api.nem.example/v1/realtime']
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    RealtimeEventBase:
      type: object
      required: [id, type, occurred_at]
      description: Every server event. `id` is the outbox event ID, so clients can drop duplicates.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    BalanceUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: account.balance_updated
            data:
              type: object
              required: [account_id, ledger_balance, available_balance]
              properties:
                account_id:
                  $ref: '#/components/schemas/Uuid'
                ledger_balance:
                  $ref: '#/components/schemas/Money'
                available_balance:
                  $ref: '#/components/schemas/Money'
    TransactionCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: transaction.created
            data:
              $ref: '#/components/schemas/Transaction'
    TransferUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: transfer.updated
            data:
              $ref: '#/components/schemas/Transfer'
    MoneyRequestReceivedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: money_request.received
            data:
              $ref: '#/components/schemas/MoneyRequest'
    CardAuthorizationEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: card.authorization
            data:
              $ref: '#/components/schemas/CardTransaction'
    FxAlertTriggeredEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: fx.alert_triggered
            data:
              type: object
              required: [alert, rate]
              properties:
                alert:
                  $ref: '#/components/schemas/FxAlert'
                rate:
                  $ref: '#/components/schemas/Rate'
    KycUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: kyc.updated
            data:
              type: object
              required: [tier, status, submission]
              properties:
                tier:
                  $ref: '#/components/schemas/KycTier'
                status:
                  $ref: '#/components/schemas/KycStatus'
                submission:
                  oneOf:
                    - $ref: '#/components/schemas/KycSubmission'
                    - type: 'null'
    StatementReadyEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: statement.ready
            data:
              $ref: '#/components/schemas/Statement'
    AjoUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: ajo.updated
            data:
              $ref: '#/components/schemas/AjoGroup'
    FamilyApprovalRequestedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: family.approval_requested
            data:
              $ref: '#/components/schemas/FamilyApproval'
    DisputeUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: dispute.updated
            data:
              $ref: '#/components/schemas/Dispute'
    SupportMessageEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: support.message
            data:
              $ref: '#/components/schemas/SupportMessage'
    SupportTypingEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: support.typing
            data:
              type: object
              required: [conversation_id, sender, typing]
              properties:
                conversation_id:
                  $ref: '#/components/schemas/Uuid'
                sender:
                  type: string
                  enum: [customer, agent]
                typing:
                  type: boolean
    NotificationCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: notification.created
            data:
              $ref: '#/components/schemas/Notification'
    SecurityPanicChangedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: security.panic_changed
            data:
              $ref: '#/components/schemas/PanicState'
    SessionRevokedEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeEventBase'
        - type: object
          required: [type, data]
          description: The app logs out at once when its own session is revoked.
          properties:
            type:
              type: string
              const: session.revoked
            data:
              type: object
              required: [session_id, device_id, reason]
              properties:
                session_id:
                  $ref: '#/components/schemas/Uuid'
                device_id:
                  $ref: '#/components/schemas/Uuid'
                reason:
                  type: string
                  enum: [user_revoked, device_revoked, password_reset, refresh_reuse, staff_action]
    RealtimeEvent:
      description: Every message the server sends over the WebSocket.
      oneOf:
        - $ref: '#/components/schemas/BalanceUpdatedEvent'
        - $ref: '#/components/schemas/TransactionCreatedEvent'
        - $ref: '#/components/schemas/TransferUpdatedEvent'
        - $ref: '#/components/schemas/MoneyRequestReceivedEvent'
        - $ref: '#/components/schemas/CardAuthorizationEvent'
        - $ref: '#/components/schemas/FxAlertTriggeredEvent'
        - $ref: '#/components/schemas/KycUpdatedEvent'
        - $ref: '#/components/schemas/StatementReadyEvent'
        - $ref: '#/components/schemas/AjoUpdatedEvent'
        - $ref: '#/components/schemas/FamilyApprovalRequestedEvent'
        - $ref: '#/components/schemas/DisputeUpdatedEvent'
        - $ref: '#/components/schemas/SupportMessageEvent'
        - $ref: '#/components/schemas/SupportTypingEvent'
        - $ref: '#/components/schemas/NotificationCreatedEvent'
        - $ref: '#/components/schemas/SecurityPanicChangedEvent'
        - $ref: '#/components/schemas/SessionRevokedEvent'
      discriminator:
        propertyName: type
        mapping:
          account.balance_updated: '#/components/schemas/BalanceUpdatedEvent'
          transaction.created: '#/components/schemas/TransactionCreatedEvent'
          transfer.updated: '#/components/schemas/TransferUpdatedEvent'
          money_request.received: '#/components/schemas/MoneyRequestReceivedEvent'
          card.authorization: '#/components/schemas/CardAuthorizationEvent'
          fx.alert_triggered: '#/components/schemas/FxAlertTriggeredEvent'
          kyc.updated: '#/components/schemas/KycUpdatedEvent'
          statement.ready: '#/components/schemas/StatementReadyEvent'
          ajo.updated: '#/components/schemas/AjoUpdatedEvent'
          family.approval_requested: '#/components/schemas/FamilyApprovalRequestedEvent'
          dispute.updated: '#/components/schemas/DisputeUpdatedEvent'
          support.message: '#/components/schemas/SupportMessageEvent'
          support.typing: '#/components/schemas/SupportTypingEvent'
          notification.created: '#/components/schemas/NotificationCreatedEvent'
          security.panic_changed: '#/components/schemas/SecurityPanicChangedEvent'
          session.revoked: '#/components/schemas/SessionRevokedEvent'
    RealtimeClientMessage:
      description: Messages the app may send over the WebSocket.
      oneOf:
        - type: object
          required: [type]
          properties:
            type:
              type: string
              const: ping
        - type: object
          required: [type, conversation_id, typing]
          properties:
            type:
              type: string
              const: support.typing
            conversation_id:
              $ref: '#/components/schemas/Uuid'
            typing:
              type: boolean
        - type: object
          required: [type, last_event_id]
          description: After a reconnect, replay events missed since this ID (kept for 24 hours).
          properties:
            type:
              type: string
              const: resume
            last_event_id:
              $ref: '#/components/schemas/Uuid'

    # ------------------------------------------------------------ admin: staff
    StaffRole:
      type: string
      enum: [support, compliance, finance, admin]
    Staff:
      type: object
      required: [id, name, email, roles, totp_enrolled, last_login_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          $ref: '#/components/schemas/Email'
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StaffRole'
        totp_enrolled:
          type: boolean
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
    StaffLoginChallenge:
      type: object
      required: [challenge_id, expires_at, totp_enrolment]
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        totp_enrolment:
          description: Present on first login; scan the URI into an authenticator app.
          oneOf:
            - type: object
              required: [otpauth_uri]
              properties:
                otpauth_uri:
                  type: string
                  pattern: '^otpauth://totp/'
            - type: 'null'
    StaffTotpRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    StaffSession:
      type: object
      required: [access_token, expires_at, staff]
      properties:
        access_token:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        staff:
          $ref: '#/components/schemas/Staff'
    StaffRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500

    # ------------------------------------------------------------ admin: dashboard and customers
    CurrencyVolume:
      type: object
      required: [currency, inflow, outflow, count]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        count:
          type: integer
          minimum: 0
    AdminDashboard:
      type: object
      required:
        [
          period_from,
          period_to,
          users_total,
          users_new,
          users_active_30d,
          volume,
          transfers_by_status,
          fraud_hold_rate_bps,
          fx_pnl,
          queues,
        ]
      properties:
        period_from:
          $ref: '#/components/schemas/Date'
        period_to:
          $ref: '#/components/schemas/Date'
        users_total:
          type: integer
        users_new:
          type: integer
        users_active_30d:
          type: integer
        volume:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyVolume'
        transfers_by_status:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status:
                $ref: '#/components/schemas/TransferStatus'
              count:
                type: integer
        fraud_hold_rate_bps:
          $ref: '#/components/schemas/BasisPoints'
        fx_pnl:
          type: array
          description: Spread income per currency, from the FX position accounts.
          items:
            $ref: '#/components/schemas/Money'
        queues:
          type: object
          required: [kyc_pending, fraud_open, disputes_open, support_open, approvals_pending]
          properties:
            kyc_pending:
              type: integer
            fraud_open:
              type: integer
            disputes_open:
              type: integer
            support_open:
              type: integer
            approvals_pending:
              type: integer
    CustomerSummary:
      type: object
      required: [user_id, name, email_masked, phone_masked, nemtag, kyc_tier, status, created_at]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email_masked:
          type: string
        phone_masked:
          type: string
        nemtag:
          type: [string, 'null']
        kyc_tier:
          $ref: '#/components/schemas/KycTier'
        status:
          type: string
          enum: [active, frozen, closed]
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CustomerSummaryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerSummary'
        page:
          $ref: '#/components/schemas/PageInfo'
    StaffNote:
      type: object
      required: [id, author, body, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        author:
          $ref: '#/components/schemas/StaffRef'
        body:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CreateNoteRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    Customer360:
      type: object
      required:
        [customer, accounts, kyc, devices, recent_transactions, notes, flags, panic, open_cases]
      properties:
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        date_of_birth:
          description: Hidden from the support role.
          oneOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        kyc:
          type: object
          required: [tier, status, latest_submission]
          properties:
            tier:
              $ref: '#/components/schemas/KycTier'
            status:
              $ref: '#/components/schemas/KycStatus'
            latest_submission:
              oneOf:
                - $ref: '#/components/schemas/KycSubmission'
                - type: 'null'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        recent_transactions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Transaction'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/StaffNote'
        flags:
          type: array
          items:
            type: string
            enum: [frozen, duress_triggered, fraud_watch, new_device_cool_off, limit_override, demo]
        panic:
          $ref: '#/components/schemas/PanicState'
        open_cases:
          type: object
          required: [fraud, disputes, support]
          properties:
            fraud:
              type: integer
            disputes:
              type: integer
            support:
              type: integer
    LimitOverrideRequest:
      type: object
      required: [daily_limit, expires_at, reason]
      properties:
        daily_limit:
          $ref: '#/components/schemas/Money'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
          minLength: 5
          maxLength: 500

    # ------------------------------------------------------------ admin: maker-checker
    MakerCheckerStatus:
      type: string
      enum: [pending, approved, rejected, expired]
    ApprovalRequest:
      type: object
      required:
        [
          id,
          action,
          status,
          maker,
          checker,
          reason,
          summary,
          before,
          after,
          created_at,
          decided_at,
          expires_at,
        ]
      description: A sensitive action proposed by one staff member and approved by another (ADM-10).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        action:
          type: string
          enum:
            [customer_unfreeze, limit_override, ledger_adjustment, config_change, dispute_refund]
        status:
          $ref: '#/components/schemas/MakerCheckerStatus'
        maker:
          $ref: '#/components/schemas/StaffRef'
        checker:
          oneOf:
            - $ref: '#/components/schemas/StaffRef'
            - type: 'null'
        reason:
          type: string
        summary:
          type: string
        before:
          description: The state before the change, for the checker's diff.
          type: [object, 'null']
          additionalProperties: true
        after:
          type: [object, 'null']
          additionalProperties: true
        rejection_reason:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        decided_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    ApprovalRequestPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequest'
        page:
          $ref: '#/components/schemas/PageInfo'

    # ------------------------------------------------------------ admin: kyc
    KycReview:
      type: object
      required:
        [
          submission,
          customer,
          documents,
          identity_checks,
          id_type,
          id_number_masked,
          address,
          reviewer,
        ]
      properties:
        submission:
          $ref: '#/components/schemas/KycSubmission'
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        documents:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/KycDocument'
              - type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                    description: Signed URL valid for 5 minutes.
        identity_checks:
          type: array
          items:
            $ref: '#/components/schemas/IdentityVerification'
        id_type:
          type: string
        id_number_masked:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        reviewer:
          oneOf:
            - $ref: '#/components/schemas/StaffRef'
            - type: 'null'
    KycReviewPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            type: object
            required: [submission, customer, waiting_hours]
            properties:
              submission:
                $ref: '#/components/schemas/KycSubmission'
              customer:
                $ref: '#/components/schemas/CustomerSummary'
              waiting_hours:
                type: integer
        page:
          $ref: '#/components/schemas/PageInfo'
    KycDecisionRequest:
      type: object
      required: [decision]
      description: '`reason` is required to reject or ask for resubmission; it is shown to the customer.'
      properties:
        decision:
          type: string
          enum: [approve, reject, resubmit]
        reason:
          type: string
          maxLength: 500
        resubmit_documents:
          type: array
          items:
            $ref: '#/components/schemas/KycDocumentKind'

    # ------------------------------------------------------------ admin: fraud
    FraudCaseStatus:
      type: string
      enum: [open, in_review, released, rejected]
    FraudLabel:
      type: string
      description: Ground truth for retraining the fraud model.
      enum: [fraud, legitimate, unsure]
    FraudCase:
      type: object
      required: [id, status, transfer, risk, customer, assignee, label, note, created_at, closed_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/FraudCaseStatus'
        transfer:
          $ref: '#/components/schemas/Transfer'
        risk:
          $ref: '#/components/schemas/RiskAssessment'
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        signals:
          type: object
          description: Context the reviewer needs without opening the customer 360.
          properties:
            device_age_hours:
              type: integer
            beneficiary_age_hours:
              type: [integer, 'null']
            transfers_last_24h:
              type: integer
            average_transfer:
              $ref: '#/components/schemas/Money'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/StaffRef'
            - type: 'null'
        label:
          oneOf:
            - $ref: '#/components/schemas/FraudLabel'
            - type: 'null'
        note:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        closed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    FraudCasePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FraudCase'
        page:
          $ref: '#/components/schemas/PageInfo'
    FraudDecisionRequest:
      type: object
      required: [decision, label]
      properties:
        decision:
          type: string
          enum: [release, reject]
        label:
          $ref: '#/components/schemas/FraudLabel'
        note:
          type: string
          maxLength: 1000
        customer_message:
          type: string
          maxLength: 300
          description: Optional plain-language note for the customer.

    # ------------------------------------------------------------ admin: disputes and support
    AdminDispute:
      type: object
      required: [dispute, customer, transaction, assignee]
      properties:
        dispute:
          $ref: '#/components/schemas/Dispute'
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        transaction:
          $ref: '#/components/schemas/TransactionDetail'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/StaffRef'
            - type: 'null'
    AdminDisputePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDispute'
        page:
          $ref: '#/components/schemas/PageInfo'
    DisputeDecisionRequest:
      type: object
      required: [outcome, note]
      properties:
        outcome:
          type: string
          enum: [refund, decline, request_info]
        refund_amount:
          description: Required for `refund`; at most the disputed amount.
          $ref: '#/components/schemas/Money'
        note:
          type: string
          minLength: 5
          maxLength: 1000
          description: Shown to the customer.
    AgentConversation:
      type: object
      required: [conversation, customer, waiting_minutes]
      properties:
        conversation:
          $ref: '#/components/schemas/SupportConversation'
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        waiting_minutes:
          type: integer
          minimum: 0
    AgentConversationPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversation'
        page:
          $ref: '#/components/schemas/PageInfo'

    # ------------------------------------------------------------ admin: ledger
    LedgerOwnerType:
      type: string
      enum: [customer, system]
    LedgerAccountKind:
      type: string
      description: |
        Customer kinds plus system accounts: fee income, FX positions (one per currency),
        interest expense, ajo escrow, card settlement, partner settlement, levy payable,
        demo funding and suspense.
      enum:
        - customer_current
        - customer_wallet
        - customer_savings
        - customer_locked
        - customer_loan
        - fee_income
        - fx_position
        - interest_expense
        - interest_income
        - ajo_escrow
        - card_settlement
        - partner_settlement
        - levy_payable
        - demo_funding
        - suspense
    LedgerAccount:
      type: object
      required: [id, owner_type, owner_id, kind, currency, balance, available, version, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        owner_type:
          $ref: '#/components/schemas/LedgerOwnerType'
        owner_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/LedgerAccountKind'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        name:
          type: string
        balance:
          $ref: '#/components/schemas/Money'
        available:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          description: Optimistic version, bumped on every posting.
        created_at:
          $ref: '#/components/schemas/Timestamp'
    LedgerAccountPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccount'
        page:
          $ref: '#/components/schemas/PageInfo'
    Posting:
      type: object
      required: [id, entry_id, account_id, amount, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        entry_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          description: Signed; credits are positive, debits negative.
          $ref: '#/components/schemas/Money'
        balance_after:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PostingPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        page:
          $ref: '#/components/schemas/PageInfo'
    JournalEntryKind:
      type: string
      enum:
        - transfer_internal
        - transfer_external
        - transfer_reversal
        - fee
        - levy
        - fx_conversion
        - card_authorization
        - card_settlement
        - card_reversal
        - bill_payment
        - savings
        - interest_accrual
        - ajo_contribution
        - ajo_payout
        - loan_disbursement
        - loan_repayment
        - dispute_refund
        - demo_funding
        - manual_adjustment
    JournalEntry:
      type: object
      required: [id, kind, reference, idempotency_key, postings, created_at, metadata]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/JournalEntryKind'
        reference:
          type: string
        idempotency_key:
          type: [string, 'null']
        postings:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Posting'
        metadata:
          type: object
          additionalProperties: true
        approval_id:
          description: Set for manual adjustments.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    JournalEntryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    TrialBalanceLine:
      type: object
      required: [currency, total_debits, total_credits, net, balanced, accounts]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        total_debits:
          $ref: '#/components/schemas/Money'
        total_credits:
          $ref: '#/components/schemas/Money'
        net:
          description: Must be zero.
          $ref: '#/components/schemas/Money'
        balanced:
          type: boolean
        accounts:
          type: integer
          minimum: 0
    TrialBalance:
      type: object
      required: [as_of, balanced, currencies, generated_in_ms]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
        balanced:
          type: boolean
          description: True only when every currency nets to zero.
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/TrialBalanceLine'
        generated_in_ms:
          type: integer
    ReconciliationItem:
      type: object
      required: [reference, ledger_amount, partner_amount, status]
      properties:
        reference:
          type: string
        ledger_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        partner_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        status:
          type: string
          enum: [matched, missing_in_ledger, missing_at_partner, amount_mismatch]
    ReconciliationReport:
      type: object
      required: [date, partner, matched, unmatched, items, generated_at]
      properties:
        date:
          $ref: '#/components/schemas/Date'
        partner:
          type: string
        matched:
          type: integer
        unmatched:
          type: integer
        items:
          type: array
          description: Unmatched items only.
          items:
            $ref: '#/components/schemas/ReconciliationItem'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
    LedgerAdjustmentRequest:
      type: object
      required: [reason, postings]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
        reference:
          type: string
          maxLength: 60
        postings:
          type: array
          minItems: 2
          items:
            type: object
            required: [account_id, amount]
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              amount:
                description: Signed. All postings must sum to zero per currency.
                $ref: '#/components/schemas/Money'

    # ------------------------------------------------------------ admin: config and flags
    FeeBand:
      type: object
      required: [up_to, fee]
      properties:
        up_to:
          description: Upper bound of the band; null for the last band.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        fee:
          $ref: '#/components/schemas/Money'
    TierLimit:
      type: object
      required: [tier, daily_limit, max_balance]
      properties:
        tier:
          $ref: '#/components/schemas/KycTier'
        daily_limit:
          $ref: '#/components/schemas/Money'
        max_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    BankConfig:
      type: object
      required: [version, fees, limits, fx_spreads_bps, cooling_off, new_device, updated_at]
      properties:
        version:
          type: integer
        fees:
          type: object
          required: [internal_transfer, external_transfer_bands, emtl, emtl_threshold]
          properties:
            internal_transfer:
              $ref: '#/components/schemas/Money'
            external_transfer_bands:
              type: array
              items:
                $ref: '#/components/schemas/FeeBand'
            emtl:
              $ref: '#/components/schemas/Money'
            emtl_threshold:
              $ref: '#/components/schemas/Money'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/TierLimit'
        fx_spreads_bps:
          type: object
          description: 'Spread per pair, e.g. `{ "USD-NGN": 150 }`.'
          additionalProperties:
            $ref: '#/components/schemas/BasisPoints'
        cooling_off:
          type: object
          required: [new_beneficiary_threshold, delay_minutes]
          properties:
            new_beneficiary_threshold:
              $ref: '#/components/schemas/Money'
            delay_minutes:
              type: integer
        new_device:
          type: object
          required: [cool_off_hours, daily_limit]
          properties:
            cool_off_hours:
              type: integer
            daily_limit:
              $ref: '#/components/schemas/Money'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ConfigChangeRequest:
      type: object
      required: [section, value, reason, base_version]
      properties:
        section:
          type: string
          enum: [fees, limits, fx_spreads_bps, cooling_off, new_device]
        value:
          description: The full new value of the section.
          type: [object, array]
        reason:
          type: string
          minLength: 5
          maxLength: 500
        base_version:
          type: integer
          description: The config version the change was made against; stale changes get 409.
    FeatureFlag:
      type: object
      required: [key, description, enabled, paid_feature, updated_at, updated_by]
      properties:
        key:
          type: string
          examples: ['international_transfers']
        description:
          type: string
        enabled:
          type: boolean
        paid_feature:
          type: boolean
          description: Needs a paid partner; turning it on needs a connected adapter.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        updated_by:
          oneOf:
            - $ref: '#/components/schemas/StaffRef'
            - type: 'null'
    FeatureFlagList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlag'
    UpdateFeatureFlagRequest:
      type: object
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          maxLength: 500

    # ------------------------------------------------------------ admin: audit
    AuditEntry:
      type: object
      required: [seq, id, at, actor, action, resource, metadata, prev_hash, hash]
      properties:
        seq:
          type: integer
          minimum: 1
        id:
          $ref: '#/components/schemas/Uuid'
        at:
          $ref: '#/components/schemas/Timestamp'
        actor:
          type: object
          required: [type, id, name]
          properties:
            type:
              type: string
              enum: [staff, customer, system]
            id:
              type: [string, 'null']
            name:
              type: [string, 'null']
        action:
          type: string
          examples: ['kyc.approve', 'customer.freeze', 'ledger.adjustment.approve']
        resource:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
        metadata:
          type: object
          description: Never contains PII; IDs only.
          additionalProperties: true
        ip:
          type: [string, 'null']
        prev_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        hash:
          type: string
          description: SHA-256 over `prev_hash` and the canonical entry.
          pattern: '^[0-9a-f]{64}$'
    AuditEntryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    AuditVerifyRequest:
      type: object
      properties:
        from_seq:
          type: integer
          minimum: 1
        to_seq:
          type: integer
          minimum: 1
    AuditVerification:
      type: object
      required: [valid, checked, first_broken_seq, head_seq, head_hash, verified_at]
      properties:
        valid:
          type: boolean
        checked:
          type: integer
        first_broken_seq:
          type: [integer, 'null']
        head_seq:
          type: integer
        head_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        verified_at:
          $ref: '#/components/schemas/Timestamp'

    # ------------------------------------------------------------ admin: simulators
    SimulatedChargeRequest:
      type: object
      required: [pan, expiry_month, expiry_year, cvv, amount, merchant, channel]
      properties:
        pan:
          type: string
          pattern: '^[0-9]{16}$'
          writeOnly: true
        expiry_month:
          type: integer
          minimum: 1
          maximum: 12
        expiry_year:
          type: integer
        cvv:
          type: string
          pattern: '^[0-9]{3}$'
          writeOnly: true
        amount:
          $ref: '#/components/schemas/Money'
        merchant:
          type: object
          required: [id, name, mcc, country]
          properties:
            id:
              type: string
            name:
              type: string
            mcc:
              type: string
              pattern: '^[0-9]{4}$'
            country:
              type: string
              pattern: '^[A-Z]{2}$'
        channel:
          type: string
          enum: [online, in_store]
        capture:
          type: boolean
          default: false
          description: Settle immediately instead of leaving an authorization hold.
    CaptureRequest:
      type: object
      properties:
        amount:
          description: Capture less than authorized (e.g. a final bill); defaults to the full amount.
          $ref: '#/components/schemas/Money'
    BankPartnerSimulator:
      type: object
      required: [failure_rate_bps, min_delay_seconds, max_delay_seconds, name_check]
      properties:
        failure_rate_bps:
          $ref: '#/components/schemas/BasisPoints'
        min_delay_seconds:
          type: integer
          minimum: 0
          maximum: 300
        max_delay_seconds:
          type: integer
          minimum: 0
          maximum: 600
        name_check:
          type: string
          description: How Confirmation of Payee answers in the sandbox.
          enum: [realistic, always_match, always_no_match]
        timeout_rate_bps:
          $ref: '#/components/schemas/BasisPoints'

    # ------------------------------------------------------------ demo controls
    DemoFundRequest:
      type: object
      required: [account_id, amount]
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Money'
    DemoInboundRequest:
      type: object
      required: [account_id, amount, sender_name]
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Money'
        sender_name:
          type: string
          maxLength: 60
        sender_bank:
          type: string
          maxLength: 60
        narration:
          type: string
          maxLength: 100
    DemoTimeTravelRequest:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 365
    DemoClock:
      type: object
      required: [now, offset_days]
      properties:
        now:
          $ref: '#/components/schemas/Timestamp'
        offset_days:
          type: integer
          minimum: 0

    # ------------------------------------------------------------ developer
    ApiKeyScope:
      type: string
      enum: [accounts_read, transactions_read, transfers_read, payment_links_write, webhooks_manage]
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, environment, created_at, last_used_at, revoked_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key, for recognising it.
          examples: ['nem_test_7Hq2']
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        environment:
          type: string
          description: Only sandbox exists in v1 (DEV-2).
          enum: [sandbox]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ApiKeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 40
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApiKeyScope'
    ApiKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
          description: Shown once. Stored only as a SHA-256 hash.
          pattern: '^nem_test_[A-Za-z0-9]{32}$'
    WebhookEventType:
      type: string
      enum:
        [
          payment_link.paid,
          transfer.completed,
          transfer.failed,
          transfer.reversed,
          account.credited,
          test.ping,
        ]
    WebhookEndpoint:
      type: object
      required: [id, url, events, status, secret_prefix, consecutive_failures, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          format: uri
          pattern: '^https://'
        description:
          type: [string, 'null']
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          description: Endpoints are disabled automatically after 3 days of failures.
          enum: [active, disabled]
        secret_prefix:
          type: string
          examples: ['whsec_3Fk9']
        consecutive_failures:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookEndpointList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
    CreateWebhookEndpointRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 500
        description:
          type: string
          maxLength: 100
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
    UpdateWebhookEndpointRequest:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 500
        description:
          type: [string, 'null']
          maxLength: 100
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          enum: [active, disabled]
    WebhookEndpointCreated:
      type: object
      required: [endpoint, signing_secret]
      properties:
        endpoint:
          $ref: '#/components/schemas/WebhookEndpoint'
        signing_secret:
          type: string
          description: Shown once.
          pattern: '^whsec_[A-Za-z0-9]{32}$'
    WebhookDeliveryStatus:
      type: string
      enum: [pending, succeeded, retrying, failed]
    WebhookDelivery:
      type: object
      required:
        [
          id,
          endpoint_id,
          event_id,
          event_type,
          attempt,
          status,
          response_status,
          duration_ms,
          next_retry_at,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        endpoint_id:
          $ref: '#/components/schemas/Uuid'
        event_id:
          $ref: '#/components/schemas/Uuid'
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        attempt:
          type: integer
          minimum: 1
          maximum: 8
          description: Retries back off exponentially (1 min, 5 min, 30 min, 2 h, 6 h, 12 h, 24 h).
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        response_status:
          type: [integer, 'null']
        response_body_excerpt:
          type: [string, 'null']
          maxLength: 500
        duration_ms:
          type: [integer, 'null']
        request_body:
          $ref: '#/components/schemas/WebhookEvent'
        next_retry_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookDeliveryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        page:
          $ref: '#/components/schemas/PageInfo'
    SandboxPaymentRequest:
      type: object
      required: [payment_link_id]
      properties:
        payment_link_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          description: Required for open-amount links.
          $ref: '#/components/schemas/Money'
        payer_name:
          type: string
          maxLength: 60
          default: Sandbox Payer
    WebhookEvent:
      type: object
      required: [id, type, created_at, livemode, data]
      description: The body Nem POSTs to developer webhook endpoints.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/WebhookEventType'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        livemode:
          type: boolean
          const: false
        data:
          type: object
          required: [object]
          properties:
            object:
              description: The resource the event is about, in the same shape as the API returns it.
              anyOf:
                - $ref: '#/components/schemas/Transfer'
                - $ref: '#/components/schemas/Transaction'
                - $ref: '#/components/schemas/PaymentLink'
                - type: object
                  required: [message]
                  properties:
                    message:
                      type: string
                      const: ping

    # ------------------------------------------------------------ partners
    PartnerCallback:
      type: object
      required: [event_type, reference, occurred_at]
      properties:
        event_type:
          type: string
          enum: [transfer.settled, transfer.failed, bill.completed, bill.failed, inbound.credit]
        reference:
          type: string
          description: Nem's reference for outbound events; the partner's for inbound credits.
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        amount:
          $ref: '#/components/schemas/Money'
        account_number:
          type: string
        failure_code:
          type: [string, 'null']
        payload:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: The request is malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated, but not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PaidFeatureRequired:
      description: The feature needs a paid partner and is switched off (PRD §11). `code` is `paid_feature_required`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Semantically invalid, e.g. an idempotency key reused with a different body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: Locked after too many wrong attempts. `retry_at` says when to try again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: The service is starting up or temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The upload is larger than 5 MB.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Only JPEG, PNG and PDF uploads are accepted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
