# https://taskfile.dev — run `task --list` to see everything.
version: '3'

# Local overrides; a missing file is fine.
dotenv: ['.env']

vars:
  BIN: ./bin/api{{exeExt}}
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  dev:
    desc: Run the API with hot reload (air).
    cmds:
      # The binary name needs .exe on Windows, so air gets the build command from here.
      - air --build.cmd "go build -o ./tmp/api{{exeExt}} ./cmd/api" --build.entrypoint "./tmp/api{{exeExt}}"

  run:
    desc: Run the API once, without hot reload.
    cmds:
      - go run ./cmd/api

  build:
    desc: Build a release binary into ./bin.
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/api

  test:
    desc: Run all tests with the race detector.
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...

  db:up:
    desc: Start local Postgres (docker compose) and wait until it is healthy.
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Stop local Postgres. Data stays in the pgdata volume.
    cmds:
      - docker compose down

  db:reset:
    desc: Delete the local database and start an empty one.
    cmds:
      - docker compose down -v
      - task: db:up

  migrate:up:
    desc: Apply pending migrations (the API also does this on start).
    env: &goose
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: '{{.DATABASE_URL | default "postgres://nem:nem@localhost:5433/nem?sslmode=disable"}}'
      GOOSE_MIGRATION_DIR: db/migrations
    cmds:
      - goose up

  migrate:down:
    desc: Roll back the latest migration.
    env: *goose
    cmds:
      - goose down

  migrate:status:
    desc: Show which migrations are applied.
    env: *goose
    cmds:
      - goose status

  migrate:new:
    desc: 'Create a migration: task migrate:new -- add_users'
    env: *goose
    cmds:
      - goose -s create {{.CLI_ARGS}} sql

  generate:
    desc: Regenerate Go from the contract (oapi-codegen + Unimplemented stubs) and db/queries (sqlc).
    cmds:
      - go generate ./internal/api
      - sqlc generate

  fmt:
    desc: Format the code.
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy go.mod and go.sum.
    cmds:
      - go mod tidy
