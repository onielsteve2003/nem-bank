version: '2'

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - unused
    - ineffassign
    - bodyclose
    - noctx
    - errorlint
  exclusions:
    rules:
      # Tests use throwaway connection strings and fixtures that look like credentials.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
