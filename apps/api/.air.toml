# Hot reload for `task dev`. The build command and binary path are passed by the Taskfile
# so the same config works on Windows (.exe) and Unix.
root = "."
tmp_dir = "tmp"

[build]
  include_ext = ["go", "sql", "yaml"]
  exclude_dir = ["bin", "tmp", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[misc]
  clean_on_exit = true
