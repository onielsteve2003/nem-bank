            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/kyc
