packages:
  - apps/*
  - packages/*

# These ship prebuilt native binaries; their install scripts are only a fallback.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.31'
  - '@expo/router-server@57.0.13'
  - '@expo/ui@57.0.25'
  - babel-preset-expo@57.0.16
  - expo-router@57.0.28
  - expo@57.0.30
  - '@redocly/cli@2.64.1'

# Expo/Metro cannot follow pnpm's symlinked node_modules reliably, so the
# whole workspace uses a flat, npm-style layout (also set in .npmrc).
nodeLinker: hoisted
