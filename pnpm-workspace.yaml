packages:
  - apps/*
  - packages/*

# These ship prebuilt native binaries; their install scripts are only a fallback.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.31 || 58.1.15'
  - '@expo/router-server@57.0.13 || 58.0.17'
  - '@expo/ui@57.0.25'
  - babel-preset-expo@57.0.16 || 58.0.20
  - expo-router@57.0.28 || 58.0.26
  - expo@57.0.30 || 58.0.19
  - '@redocly/cli@2.64.1'
  - '@tanstack/query-async-storage-persister@5.104.4'
  - '@tanstack/query-core@5.104.4'
  - '@tanstack/query-persist-client-core@5.104.4'
  - '@tanstack/react-query-persist-client@5.104.4'
  - '@tanstack/react-query@5.104.4'
  - '@expo/config@58.0.8'
  - '@expo/local-build-cache-provider@58.0.8'
  - '@expo/metro-config@58.0.17'
  - '@expo/prebuild-config@58.0.16'
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-server@58.0.6
  - expo-glass-effect@58.0.5
  - expo-image@58.0.17
  - expo-sqlite@58.0.14

# Expo/Metro cannot follow pnpm's symlinked node_modules reliably, so the
# whole workspace uses a flat, npm-style layout (also set in .npmrc).
nodeLinker: hoisted
