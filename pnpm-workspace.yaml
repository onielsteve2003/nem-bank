packages:
  - apps/*
  - packages/*

# unrs-resolver ships prebuilt native binaries; its postinstall is only a fallback.
allowBuilds:
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.31'
  - '@expo/router-server@57.0.13'
  - '@expo/ui@57.0.25'
  - babel-preset-expo@57.0.16
  - expo-router@57.0.28
  - expo@57.0.30

# Expo/Metro cannot follow pnpm's symlinked node_modules reliably, so the
# whole workspace uses a flat, npm-style layout (also set in .npmrc).
nodeLinker: hoisted
